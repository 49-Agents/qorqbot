[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
license = "Apache-2.0 AND GPL-3.0-only"
license-files = ["LICENSE", "LICENSE-SCOPE.md", "LICENSES/GPL-3.0.txt", "SOURCE-AVAILABILITY.md"]
name = "qorqut-whatsapp"
version = "0.1.0"
description = "Optional private WhatsApp reading and owner-approved sending for Qorqbot"
requires-python = ">=3.12"
dependencies = ["qorqut-core==1.3.0.dev0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qorqut_whatsapp*"]

[tool.setuptools.package-data]
qorqut_whatsapp = ["index.json", "assets/*.js", "assets/*.css", "bin/whatsapp-personal", "build.json", "third_party/**/*"]
