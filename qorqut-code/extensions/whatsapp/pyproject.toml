[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qorqut-whatsapp"
version = "0.1.0"
description = "Optional private WhatsApp reading and owner-approved sending for Qorqbot"
requires-python = ">=3.12"
dependencies = ["bazarlyk-core==1.3.0.dev0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qorqut_whatsapp*"]

[tool.setuptools.package-data]
qorqut_whatsapp = ["guidance.md", "index.json", "assets/*.js", "assets/*.css", "bin/whatsapp-personal", "build.json", "third_party/**/*"]
