[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "RELEASE-LICENSES.json"]
name = "qorqut-openrouter"
version = "0.1.0"
description = "OpenRouter for a Qorqbot host: the owner's own OpenRouter key and voice input in Chat"
readme = "README.md"
requires-python = ">=3.12"
# The host (import package ``qorqut``) supplies the extension API, the private-file helpers and the Operations engine.
# OpenRouter is reached over its HTTP API with the standard library only; there is no OpenRouter client library.
dependencies = ["qorqut-core==1.3.0.dev0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qorqut_openrouter*"]
