[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qorqut-telegram"
version = "0.1.0"
description = "Optional Telegram owner messaging connector for Qorqbot"
requires-python = ">=3.12"
dependencies = ["bazarlyk-core==1.3.0.dev0", "Pillow>=11,<13"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qorqut_telegram*"]

[tool.setuptools.package-data]
qorqut_telegram = ["resources/**/*.md", "resources/*.json", "optional/**/*.md"]
