[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "RELEASE-LICENSES.json"]
name = "qorqut-telegram"
version = "0.1.0"
description = "Optional Telegram owner messaging connector for Qorqbot"
requires-python = ">=3.12"
dependencies = ["qorqut-core==1.3.0.dev0", "Pillow>=11,<13"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qorqut_telegram*"]

[tool.setuptools.package-data]
qorqut_telegram = ["resources/*.json"]
