const embeddedAgentPane=true;
let leave, dispose;
let currentSession;
window.focusExpansion={async open({title,mount}){
  if(leave && !await leave())return null;
  if(currentSession)await currentSession.close();
  const host=document.querySelector('.agfocus-expansion-content');host.replaceChildren();
  const shell=host.closest('.agfocus-surface');shell.setAttribute('aria-label',title);shell.querySelector('.agfocus-surface-title').textContent=title;
  const listeners=[];
  const session={host,isCurrent:()=>currentSession===session,setTitle(value){shell.querySelector('.agfocus-surface-title').textContent=value},setBeforeLeave(fn){leave=fn},onDispose(fn){listeners.push(fn)},async close(){if(!this.isCurrent() || leave && !await leave())return false;dispose?.();dispose=null;leave=null;currentSession=null;listeners.forEach(fn=>fn());host.replaceChildren();return true}};
  currentSession=session;dispose=mount(host,session);return session;
}};
document.querySelector('.agfocus-close').onclick=()=>currentSession?.close();
