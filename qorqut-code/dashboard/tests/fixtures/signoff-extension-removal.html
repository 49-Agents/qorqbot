<script>
// The removal of a downloaded extension: Remove, and Remove and delete its data. Stubs for the dashboard globals the real Signoff renderer expects; signoffs.js is the real file.
const state = {agents: [], project: 'demo', projects: [{id: 'b1', slug: 'demo', name: 'Demo'}], session: null};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sjDateTime = d => String(d), aicon = () => '', newRequestId = () => 'req';
const coreData = r => r.data;
const calls=[]; const flags={failAmend:false, failApprove:false};
const fail = (code, message) => Promise.reject(Object.assign(new Error(message), {code}));
const post = (url,body) => { if(url==='/root/attention-queue')return Promise.resolve({data:{items:[]}}); calls.push({url,body});
  const parts=url.split('/'), id=parts.at(-2), action=parts.at(-1);
  if(action==='amend'){ if(flags.failAmend)return fail('stale_signoff','This proposal changed; reload it before editing'); return Promise.resolve({status:'ok',data:{signoff:amend(id,body)}}); }
  if(action==='approve' && flags.failApprove)return fail('busy','Signoffs are busy. Try again.');
  const signoff={...items[id], state:action==='approve'?'approved':'rejected', actionable:false, status_revision:items[id].status_revision+1, decision:{kind:action,at:new Date().toISOString(),feedback:body.feedback}};
  items[id]=signoff; return Promise.resolve({status:'ok',data:{signoff}}); };
const fields = (deleted) => [{path:'extension',before:null,after:'Network'},{path:'version',before:null,after:'1.0.0'},
  {path:'after_approval',before:null,after:`Qorqbot restarts once. ${deleted?'Its private data is deleted.':'Its private data stays.'} Projects, tables and records it created stay.`}];
const removal = (id, deleted, more = {}) => ({id, state: 'pending', category: 'internal_change', operation_name: 'extensions_remove', review_project_id: null, status_revision: 1, proposal_revision: 1,
  payload_hash: 'h' + id, actionable: true, title: 'Remove the extension Network', editable_fields: ['delete_data'], rejection_requires_message: false, proposer_agent_id: 'a1', proposer_display_name: 'Ordubashy',
  created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
  preview: {title: 'Remove the extension Network', rationale: '', effects: [], approve_label: deleted ? 'Remove and delete its data' : 'Remove',
    ...(deleted ? {amend_note: "Chose to delete the extension's private data as well."} : {amend_and_approve: {label: 'Remove and delete its data', changes: {delete_data: true}}}),
    changes: [{kind: 'structured', resource: {resource_type: 'extension', resource_id: 'network', label: 'Extension'}, fields: fields(deleted)}],
    resources: [{resource_type: 'extension', resource_id: 'network', label: 'Extension'}]}, ...more});
const plain = {...removal('plain', false), operation_name: 'tasks_update', title: 'Update a task', editable_fields: undefined,
  preview: {title: 'Update a task', rationale: '', effects: [], changes: [{kind: 'structured', resource: {resource_type: 'tasks', resource_id: 't1', label: 'Task'}, fields: [{path: 'title', before: 'Old', after: 'New'}]}], resources: []}};
const items = {removal: removal('removal', false), plain};
const amend = (id, body) => { const next = removal(id + '-edited', body.changes.delete_data === true, {supersedes_id: id});
  next.preview.owner_edit = {by: 'o1', at: 'now', previous_id: id};
  items[id] = {...items[id], state: 'conflicted', superseded_by_id: next.id}; items[next.id] = next; return next; };
const api = async url => { if(url==='/session')return {status:'ok',data:{principal_kind:'human',is_owner:true,principal_id:'o1'}}; if(url==='/root/attention-queue')return {data:{items:[]}}; if(url.startsWith('/root/signoffs?'))return {data:{items:Object.values(items).filter(s=>s.state==='pending' && !s.superseded_by_id)}}; const found=items[decodeURIComponent(url.split('/').pop())]; return {status:'ok',data:{signoff:found}}; };
const globalAgentProfile = () => null, globalAgentProfiles = [1], identityAvatar = () => '', RW_CHAT_ICON = '', SVG_X = '', SVG_CHECK = '', T_VIEW_ICON = {signoffs: ''};
const taskProjectLabel = () => 'Demo', projectPortraitHtml = () => '';
</script>

<script>
const embeddedAgentPane=true;
let leave, dispose;
let currentSession;
window.focusExpansion={async open({title,mount}){
  if(leave && !await leave())return null;
  if(currentSession)await currentSession.close();
  const host=document.querySelector('.agfocus-expansion-content');host.replaceChildren();
  const shell=host.closest('.agfocus-surface');shell.setAttribute('aria-label',title);shell.querySelector('.agfocus-surface-title').textContent=title;
  const listeners=[];
  const session={host,isCurrent:()=>currentSession===session,setTitle(value){shell.querySelector('.agfocus-surface-title').textContent=value},setBeforeLeave(fn){leave=fn},onDispose(fn){listeners.push(fn)},async close(){if(!this.isCurrent() || leave && !await leave())return false;dispose?.();dispose=null;leave=null;currentSession=null;listeners.forEach(fn=>fn());host.replaceChildren();return true}};
  currentSession=session;dispose=mount(host,session);return session;
}};
document.querySelector('.agfocus-close').onclick=()=>currentSession?.close();
const workRelatedChips=()=>{}, toast=()=>{}, accessLost=()=>false, remAttempts=new Map(), remVerifiedOwner=async()=> 'o1';
</script><script src="../../js/signoff-attention.js"></script><script>

</script><script>

</script>
