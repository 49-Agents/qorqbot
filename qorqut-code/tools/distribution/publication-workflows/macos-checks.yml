name: Native Mac preparation checks
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional SemVer for a downloadable DMG candidate (for example 1.3.0-preview.2)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install desktop build dependencies and select version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm ci --prefix qorqut-code/tools/distribution/macos_app/electron
          node <<'JS'
          const fs = require('node:fs');
          const semver = require('./qorqut-code/tools/distribution/macos_app/electron/node_modules/semver');
          const version = process.env.RELEASE_VERSION || require('node:child_process').execFileSync('python3', ['qorqut-code/tools/distribution/build_version.py', '1.3.0', 'mac-check', '--commit', process.env.GITHUB_SHA], {encoding: 'utf8'}).trim();
          if (semver.valid(version) !== version) throw new Error('Version must be canonical SemVer');
          fs.appendFileSync(process.env.GITHUB_ENV, `QORQBOT_BUILD_VERSION=${version}\nRELEASE_WORK=${process.env.RUNNER_TEMP}/qorqbot-mac\n`);
          JS
      - name: Check native target and install build prerequisites
        run: |
          test "$(uname -m)" = arm64
          brew install tmux librsvg
          python -m pip install packaging
      - name: Export and build this exact commit
        run: |
          mkdir -p "$RELEASE_WORK"
          python qorqut-code/tools/export-unified.py --repository "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" --with-fastmail --output "$RELEASE_WORK/source"
          python qorqut-code/tools/distribution/runtime_source.py project --source "$RELEASE_WORK/source" --output "$RELEASE_WORK/runtime-source" --report "$RELEASE_WORK/projection.json"
          python qorqut-code/tools/prepare-local.py --source-root "$RELEASE_WORK/runtime-source" --output "$RELEASE_WORK/prepared" --with-google-calendar
          python qorqut-code/tools/distribution/runtime_source.py audit --prepared "$RELEASE_WORK/prepared" --report "$RELEASE_WORK/contents.json"
          python qorqut-code/tools/distribution/native_build.py --prepared "$RELEASE_WORK/prepared" --target macos14-arm64 --output "$RELEASE_WORK/package" --report "$RELEASE_WORK/build.json" --version "$QORQBOT_BUILD_VERSION"
      - name: Check exact Mac archive lifecycle
        run: |
          python qorqut-code/tools/distribution/check_posix.py --archive "$RELEASE_WORK/package/qorqbot-${QORQBOT_BUILD_VERSION}-macos14-arm64.tar.gz" --output "/tmp/qm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Run Mac runtime and launcher tests
        run: |
          test_python="/tmp/qm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/i/qorqbot/runtime/venv/bin/python"
          "$test_python" -I -B -m unittest discover -s qorqut-code/app/tests
          "$test_python" -I -B -m unittest discover -s qorqut-code/tools/distribution/tests
      - name: Check desktop launcher and signed DMG
        run: |
          npm test --prefix qorqut-code/tools/distribution/macos_app/electron
          python -B -m unittest discover -s qorqut-code/tools/distribution/macos_app/tests
      - name: Build the downloadable DMG from the checked archive
        if: inputs.version != ''
        run: |
          python qorqut-code/tools/distribution/macos_app/build_dmg.py --archive "$RELEASE_WORK/package/qorqbot-${QORQBOT_BUILD_VERSION}-macos14-arm64.tar.gz" --output "$RELEASE_WORK/dmg"
      - name: Check the packaged launcher with a fresh home folder
        if: inputs.version != ''
        run: |
          mount="$RELEASE_WORK/mounted"
          mkdir "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$RELEASE_WORK/dmg/Qorqbot-${QORQBOT_BUILD_VERSION}-macos14-arm64.dmg"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/Qorqbot.app"
          codesign --verify --deep --strict "$app"
          archive="$RELEASE_WORK/package/qorqbot-${QORQBOT_BUILD_VERSION}-macos14-arm64.tar.gz"
          cmp "$archive" "$app/Contents/Resources/qorqbot-payload/$(basename "$archive")"
          digest=$(shasum -a 256 "$archive" | cut -d ' ' -f 1)
          export HOME="/tmp/qd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$HOME"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Qorqbot" qorqut-code/tools/distribution/macos_app/check_dmg.cjs "$app/Contents/Resources" "$QORQBOT_BUILD_VERSION" "$digest" "$RELEASE_WORK/desktop-check.json"
      - name: Save the checked candidate and build evidence
        if: inputs.version != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qorqbot-mac-${{ env.QORQBOT_BUILD_VERSION }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ env.RELEASE_WORK }}/dmg/*
            ${{ env.RELEASE_WORK }}/package/*.tar.gz
            ${{ env.RELEASE_WORK }}/build.json
            ${{ env.RELEASE_WORK }}/contents.json
            ${{ env.RELEASE_WORK }}/desktop-check.json
      # This job prepares and checks a candidate only. It does not publish,
      # change repository visibility or use accounts/native agent clients.
      # Real terminal/browser acceptance remains a separate Mac release gate.
