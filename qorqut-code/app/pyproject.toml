[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bazarlyk-core"
version = "1.3.0.dev0"
description = "Shared Qorqut application operations and operational storage"
requires-python = ">=3.12"
# First-party distributions (qorqut-operations, qorqut-context, qorqut-business-docs-versioning, and the qorqut-learning extra) are
# versioned package names only. Their wheels are built from the explicitly selected local source export (tools/prepare-local.py) and
# installed by exact name and version; nothing resolves a first-party package from a Git URL or a private registry.
# The host imports qorqut_context at startup (shared Context graph reads, filing and edit driver and the Context service).
dependencies = ["qorqut-operations==1.3.0.dev0", "qorqut-context==0.1.0", "PyJWT[crypto]>=2.8,<3", "jsonschema>=4.26,<5", "PyYAML>=6,<7", "pydantic>=2.13,<3", "markdown-it-py>=3,<5", "tomli-w>=1.2,<2",
    # Bounded JPEG/PNG decoding that validates outbound Telegram photos (bazarlyk/telegram/media_validation.py).
    "Pillow>=12.3,<13",
    # Shared document history (docs/DOCUMENT-HISTORY.md).
    "qorqut-business-docs-versioning==0.2.0"]

[project.scripts]
release-worker = "bazarlyk.release_worker.cli:main"
qorqut-release-worker = "bazarlyk.release_worker.cli:main"

[project.optional-dependencies]
service = ["icalendar>=7.2,<8", "mcp>=1.29,<2", "starlette>=1.0,<2", "uvicorn>=0.52,<1", "httpx>=0.27,<1", "websockets>=16,<17"]
test = ["pytest>=7.4", "httpx>=0.27", "openpyxl>=3.1,<4"]
# The standalone learning engine behind learnings.engine_extract (docs/LEARNING-ISSUE-BRIDGE.md).
learning-engine = ["qorqut-learning==0.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bazarlyk*"]

[tool.setuptools.package-data]
"bazarlyk.agents" = ["skills/role/SKILL.md", "skills/cleanup/SKILL.md"]
"bazarlyk.bootstrap" = ["browser_init.cjs", "instructions/*.md", "instructions/operating/*.md"]
"bazarlyk.sandbox" = ["browser-seccomp-moby-29.1.3.json"]
"bazarlyk.release_worker" = ["installation.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: exercises the assembled browser runtime with disposable Chrome",
]
