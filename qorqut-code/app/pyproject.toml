[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
license = "BUSL-1.1"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "RELEASE-LICENSES.json"]
name = "bazarlyk-core"
version = "1.3.0.dev0"
description = "Shared Qorqut application operations and operational storage"
requires-python = ">=3.12"
# First-party distributions (qorqut-operations, qorqut-context, qorqut-business-docs-versioning) are
# versioned package names only. Their wheels are built from the explicitly selected local source export (tools/prepare-local.py) and
# installed by exact name and version; nothing resolves a first-party package from a Git URL or a private registry.
# The host imports qorqut_context.integration at startup (shared Context graph reads, filing and edit driver and the Context
# service); the integration extra is what pulls qorqut-operations into the Context package.
dependencies = ["qorqut-agentic==0.2.0", "qorqut-operations==1.3.0.dev0", "qorqut-context[integration]==0.1.0", "PyJWT[crypto]>=2.8,<3", "jsonschema>=4.26,<5", "PyYAML>=6,<7", "pydantic>=2.13,<3", "markdown-it-py>=3,<5", "tomli-w>=1.2,<2",
    "psutil>=7.0,<8; sys_platform == 'darwin'",
    # Shared document history (docs/DOCUMENT-HISTORY.md).
    "qorqut-business-docs-versioning==0.2.0"]

[project.scripts]
release-worker = "bazarlyk.release_worker.cli:main"
qorqut-release-worker = "bazarlyk.release_worker.cli:main"

[project.optional-dependencies]
service = ["mcp>=1.29,<2", "starlette>=1.0,<2", "uvicorn>=0.52,<1", "httpx>=0.27,<1", "websockets>=16,<17"]
test = ["pytest>=7.4", "httpx>=0.27", "openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bazarlyk*"]

[tool.setuptools.package-data]
"bazarlyk.agentic" = ["assets/*.md", "assets/index.json"]
"bazarlyk.agents" = ["skills/role/SKILL.md", "skills/cleanup/SKILL.md"]
"bazarlyk.bootstrap" = ["browser_init.cjs", "learning_removal_predecessor.json", "instructions/*.md", "instructions/operating/*.md"]
"bazarlyk.migration" = ["crm_baseline_fingerprint.json", "crm_release_fingerprints.json"]
"bazarlyk.release_worker" = ["installation.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: exercises the assembled browser runtime with disposable Chrome",
]
