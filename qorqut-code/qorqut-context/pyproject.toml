[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
license = "BUSL-1.1"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "RELEASE-LICENSES.json"]
name = "qorqut-context"
version = "0.1.0"
description = "Qorqut shared context engine: Git-backed context, propagation pipeline and Codex app-server runner"
readme = "README.md"
requires-python = ">=3.12"
# The base engine imports only the standard library. It shells out to the installed
# `git` and, for model propagation, to an installed `codex` executable; those are
# system tools, not Python distributions. `qorqut_context.integration` (the queue,
# filing, graph-edit and usage storage, the connected backend and the declarations a
# host composes) imports Operations and is installed with the `integration` extra;
# the base package never imports it.
dependencies = []

[project.optional-dependencies]
integration = ["qorqut-operations==1.3.0.dev0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qorqut_context*"]

[tool.setuptools.package-data]
# The prompt files are read from the package directory at import time.
qorqut_context = ["prompts/*.md"]
