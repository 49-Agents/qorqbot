[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bazarlyk-core"
version = "0.1.0"
description = "Shared Qorqut application operations and operational storage"
requires-python = ">=3.12"
dependencies = ["PyJWT[crypto]>=2.8,<3", "jsonschema>=4.26,<5", "PyYAML>=6,<7", "pydantic>=2.13,<3", "markdown-it-py>=3,<5", "tomli-w>=1.2,<2"]

[project.optional-dependencies]
service = ["mcp>=1.29,<2", "starlette>=1.0,<2", "uvicorn>=0.52,<1", "httpx>=0.27,<1", "websockets>=16,<17"]
test = ["pytest>=7.4", "httpx>=0.27", "openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bazarlyk*"]

[tool.setuptools.package-data]
"bazarlyk.bootstrap" = ["browser_init.cjs"]
"bazarlyk.sandbox" = ["browser-seccomp-moby-29.1.3.json"]
"bazarlyk.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
