[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bazarlyk-core"
version = "0.1.0"
description = "Shared Qorqut application operations and operational storage"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.26,<5", "PyYAML>=6,<7", "pydantic>=2.13,<3", "markdown-it-py>=3,<5"]

[project.optional-dependencies]
service = ["mcp>=1.29,<2", "starlette>=1.0,<2", "uvicorn>=0.52,<1"]
test = ["pytest>=7.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bazarlyk*"]

[tool.setuptools.package-data]
"bazarlyk.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
