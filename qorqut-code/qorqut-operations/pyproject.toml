[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "RELEASE-LICENSES.json"]
name = "qorqut-operations"
version = "1.3.0.dev0"
description = "Portable Qorqut Operations engine: authority, storage and application contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.18", "markdown-it-py>=3,<5", "PyYAML>=6,<7", "qorqut-business-docs-versioning==0.2.0", "qorqut-agentic==0.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qorqut_operations*"]
