[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qorqut-operations"
version = "1.3.0.dev0"
description = "Portable Qorqut Operations engine: authority, storage and application contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qorqut_operations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
