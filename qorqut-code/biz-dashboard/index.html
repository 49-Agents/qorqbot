<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazarlyk</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/css/agents.css">
<link rel="stylesheet" href="/css/tasks.css">
<link rel="stylesheet" href="/css/side.css">
<link rel="stylesheet" href="/css/context.css">
</head>
<body>
<div class="navwrap" id="navwrap">
  <button class="handle" id="handle" title="Businesses" aria-label="Businesses"><i></i><i></i></button>
  <nav class="rail">
    <h1>Businesses</h1>
    <div id="bizlist"></div>
    <div class="foot" id="foot">bazarlyk</div>
  </nav>
</div>
<div class="app">
  <section class="main">
    <div class="tabs" id="tabs">
      <div class="tab on" data-tab="agents">Agents</div>
      <div class="tab" data-tab="marketing">Marketing</div>
      <div class="tab" data-tab="accounting">Accounting</div>
      <div class="tab soon" data-tab="datascience">Data science</div>
      <div class="tab soon" data-tab="progress">Progress</div>
      <div class="tab" data-tab="context">Context</div>
      <div class="tab soon" data-tab="code">Code</div>
    </div>
    <div class="content" id="content"></div>
  </section>
  <aside class="side">
    <h2>Log</h2>
    <div class="log" id="log"></div>
  </aside>
</div>
<div class="taskswrap" id="taskswrap">
  <button class="thandle" id="thandle" title="Tasks" aria-label="Tasks"><span class="n" id="tcount"></span></button>
  <aside class="tasks" id="taskspanel"></aside>
</div>
<div class="toast" id="toast"></div>

<script src="/js/core.js"></script>
<script src="/js/agents.js"></script>
<script src="/js/marketing.js"></script>
<script src="/js/accounting.js"></script>
<script src="/js/context.js"></script>
<script src="/js/side.js"></script>
<script src="/js/tasks.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
