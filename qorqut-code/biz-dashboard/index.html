<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazarlyk</title>
<style>
  :root {
    --paper: #f6f4ef; --paper-2: #efece5; --ink: #1c1b19; --ink-2: #5d5a54; --ink-3: #9a968e;
    --line: #dcd8cf; --accent: #b5482b; --accent-soft: #f2e4de; --ok: #4d6b53; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 1px solid var(--line); padding: 5px 12px; cursor: pointer; border-radius: 2px; }
  button:hover { border-color: var(--ink); }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button.primary:disabled { opacity: .4; cursor: default; }
  .app { display: grid; grid-template-columns: 220px 1fr 360px; height: 100vh; }
  .rail, .side { border-right: 1px solid var(--line); overflow-y: auto; }
  .side { border-right: 0; border-left: 1px solid var(--line); }
  .rail h1 { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; font-weight: 500; margin: 0; padding: 22px 22px 14px; color: var(--ink-2); }
  .biz { display: block; padding: 12px 22px; border-left: 2px solid transparent; }
  .biz:hover { background: var(--paper-2); }
  .biz.on { border-left-color: var(--accent); background: var(--paper-2); }
  .biz .name { font-weight: 500; }
  .biz .meta { color: var(--ink-3); font-size: 12px; }
  .rail .foot { padding: 18px 22px; color: var(--ink-3); font-size: 12px; border-top: 1px solid var(--line); margin-top: 20px; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  header { padding: 22px 32px 0; border-bottom: 1px solid var(--line); }
  header .title { font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
  header .sub { color: var(--ink-2); margin-top: 2px; }
  .tabs { display: flex; gap: 26px; margin-top: 18px; }
  .tab { padding: 8px 0 12px; color: var(--ink-3); border-bottom: 2px solid transparent; cursor: pointer; letter-spacing: .04em; }
  .tab.on { color: var(--ink); border-bottom-color: var(--ink); }
  .content { flex: 1; overflow: hidden; display: flex; min-height: 0; }
  .pane { flex: 1; overflow-y: auto; padding: 26px 32px; min-width: 0; }
  h2 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 500; color: var(--ink-3); margin: 26px 0 10px; }
  h2:first-child { margin-top: 0; }
  .side h2 { padding: 0 22px; margin: 24px 0 8px; }
  .side h2:first-child { margin-top: 22px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 500; color: var(--ink-3); font-size: 12px; }
  td.num, th.num { text-align: right; padding-right: 10px; }
  pre { font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; margin: 0; background: var(--paper-2); padding: 14px 16px; border-radius: 2px; }
  .muted { color: var(--ink-3); }
  .small { font-size: 12px; }
  .empty { color: var(--ink-3); padding: 8px 0; }
  .row { display: flex; gap: 12px; align-items: baseline; }
  /* agents */
  .agents { display: grid; grid-template-columns: 200px 1fr; height: 100%; min-height: 0; }
  .agentlist { border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 0; }
  .agent { padding: 10px 24px; cursor: pointer; border-left: 2px solid transparent; }
  .agent.on { border-left-color: var(--accent); background: var(--paper-2); }
  .agent .st { font-size: 12px; color: var(--ink-3); }
  .agent .st.live { color: var(--accent); }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  .chat .top { padding: 14px 28px; border-bottom: 1px solid var(--line); display: flex; gap: 18px; align-items: center; }
  .chat .top .name { font-weight: 500; }
  .chat .top .sp { flex: 1; }
  .msgs { flex: 1; overflow-y: auto; padding: 22px 28px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 72%; padding: 10px 14px; border-radius: 3px; white-space: pre-wrap; word-break: break-word; }
  .m.user { align-self: flex-end; background: var(--ink); color: var(--paper); }
  .m.agent { align-self: flex-start; background: var(--paper-2); }
  .m.tool { align-self: flex-start; background: none; border-left: 2px solid var(--line); padding: 2px 12px; color: var(--ink-2); font: 12px/1.5 var(--mono); max-width: 90%; }
  .m.tool .out { color: var(--ink-3); white-space: pre-wrap; max-height: 120px; overflow: hidden; }
  .m.tool.err { border-left-color: var(--accent); }
  .m.sys { align-self: center; color: var(--ink-3); font-size: 12px; background: none; padding: 4px; }
  .m.day { align-self: center; color: var(--ink-3); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; background: none; margin-top: 12px; }
  .compose { border-top: 1px solid var(--line); padding: 14px 28px; display: flex; gap: 12px; align-items: flex-end; }
  .compose textarea { flex: 1; resize: none; border: 1px solid var(--line); background: #fff; padding: 10px 12px; border-radius: 2px; min-height: 42px; max-height: 160px; outline: none; }
  .compose textarea:focus { border-color: var(--ink); }
  details { border-top: 1px solid var(--line); }
  details summary { cursor: pointer; padding: 10px 0; color: var(--ink-2); list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary { color: var(--ink); }
  /* side */
  .log { padding: 0 22px; }
  .le { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .le .h { display: flex; gap: 10px; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .le .tag { color: var(--ink-2); }
  .le .tag.marketing { color: var(--accent); }
  .le .s { margin-top: 2px; }
  .task { padding: 7px 22px; border-bottom: 1px solid var(--line); }
  .task .t { display: flex; justify-content: space-between; gap: 8px; }
  .task .id { font: 11.5px var(--mono); color: var(--ink-3); }
  .task .st { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .task .st.doing { color: var(--accent); }
  .owner { padding: 12px 22px 4px; font-size: 12px; color: var(--ink-2); }
  .req { padding: 7px 22px; border-bottom: 1px solid var(--line); font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; }
  .req .id { font-family: var(--mono); font-size: 11.5px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--line); margin-right: 8px; vertical-align: middle; }
  .dot.on { background: var(--accent); }
  .dot.ok { background: var(--ok); }
  .side .actions { padding: 6px 22px 22px; display: flex; gap: 8px; flex-wrap: wrap; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 2px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 1100px) { .app { grid-template-columns: 180px 1fr 300px; } }
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <h1>Businesses</h1>
    <div id="bizlist"></div>
    <div class="foot" id="foot">bazarlyk</div>
  </nav>
  <section class="main">
    <header>
      <div class="title" id="title">—</div>
      <div class="sub" id="sub"></div>
      <div class="tabs" id="tabs">
        <div class="tab on" data-tab="agents">Agents</div>
        <div class="tab" data-tab="analytics">Analytics</div>
        <div class="tab" data-tab="money">Money</div>
        <div class="tab" data-tab="context">Context</div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </section>
  <aside class="side">
    <h2>Log</h2>
    <div class="log" id="log"></div>
    <h2>Open tasks</h2>
    <div id="tasks"></div>
    <h2>Requests</h2>
    <div id="requests"></div>
    <div class="actions">
      <button id="gwbtn" title="Execute pending requests with fake results">Run mock gateway</button>
      <button id="taskbtn">New task</button>
    </div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = { biz: null, bizs: [], tab: "agents", agent: null, live: null, sessionsSeen: {} };
const api = async (p, opt) => { const r = await fetch("/api" + p, opt); return r.json(); };
const post = (p, body) => api(p, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
let toastT; const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); };
const fmtMoney = n => (n == null ? "?" : (n < 0 ? "-" : "") + (Math.abs(n) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const fmtV = c => c == null ? "?" : (Array.isArray(c) ? (c[0] == null ? "?" : (c[1] ? "~" : "") + Number(c[0]).toLocaleString()) : Number(c).toLocaleString());

// ---------------------------------------------------------------- businesses
async function loadBiz() {
  state.bizs = await api("/biz");
  const el = $("#bizlist");
  el.innerHTML = state.bizs.map(b => `<a class="biz ${b.slug === state.biz ? "on" : ""}" href="#${b.slug}" data-slug="${b.slug}">
      <div class="name">${esc(b.name)}</div><div class="meta">${esc(b.stage || "")} · ${b.agents.length} agent${b.agents.length === 1 ? "" : "s"}</div></a>`).join("")
    || `<div class="empty" style="padding:0 22px">No business repos under the root.</div>`;
  el.querySelectorAll(".biz").forEach(a => a.onclick = e => { e.preventDefault(); selectBiz(a.dataset.slug); });
  if (!state.biz && state.bizs.length) selectBiz(location.hash.slice(1) || state.bizs[0].slug);
}
function selectBiz(slug) {
  const b = state.bizs.find(x => x.slug === slug); if (!b) return;
  state.biz = slug; state.agent = b.agents[0] || null; location.hash = slug;
  document.querySelectorAll(".biz").forEach(a => a.classList.toggle("on", a.dataset.slug === slug));
  $("#title").textContent = b.name; $("#sub").textContent = b.one_liner || "";
  renderTab(); refreshSide();
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { state.tab = t.dataset.tab; document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t)); renderTab(); });

function renderTab() {
  const c = $("#content"); c.innerHTML = "";
  if (!state.biz) return;
  ({ agents: renderAgents, analytics: renderAnalytics, money: renderMoney, context: renderContext })[state.tab](c);
}

// ---------------------------------------------------------------- agents / chat
async function renderAgents(c) {
  const agents = await api(`/biz/${state.biz}/agents`);
  const live = await api(`/biz/${state.biz}/live`);
  c.innerHTML = `<div class="agents"><div class="agentlist" id="agentlist"></div><div class="chat" id="chat"></div></div>`;
  const al = $("#agentlist");
  al.innerHTML = agents.map(a => {
    const running = live.some(s => s.agent === a.name && !s.done);
    return `<div class="agent ${a.name === state.agent ? "on" : ""}" data-a="${a.name}"><div>${esc(a.name)}</div>
      <div class="st ${running ? "live" : ""}">${running ? "working" : (a.sessions.length + " session" + (a.sessions.length === 1 ? "" : "s"))}</div></div>`;
  }).join("") || `<div class="empty" style="padding:0 24px">No agents. Copy agents/_template.</div>`;
  al.querySelectorAll(".agent").forEach(d => d.onclick = () => { state.agent = d.dataset.a; renderAgents(c); });
  const a = agents.find(x => x.name === state.agent); if (!a) return;
  const ch = $("#chat");
  ch.innerHTML = `<div class="top"><span class="name">agent:${esc(a.name)}</span><span class="muted small">${esc((a.agent_yaml.match(/plugin:\s*(\S+)/) || [])[1] || "")}</span><span class="sp"></span>
      <button id="planbtn">Plan</button><button id="learnbtn">Learnings</button></div>
    <div class="msgs" id="msgs"></div>
    <div class="compose"><textarea id="box" rows="1" placeholder="Tell ${esc(a.name)} what to do. Enter to send, Shift+Enter for a new line."></textarea><button class="primary" id="send">Send</button></div>`;
  $("#planbtn").onclick = () => showDoc("PLAN.md", a.plan);
  $("#learnbtn").onclick = () => showDoc("session learnings", a.learnings || "(none yet)");
  const msgs = $("#msgs");
  // history: last 5 sessions, oldest first
  const hist = a.sessions.slice(0, 5).reverse();
  for (const f of hist) {
    const ev = await api(`/biz/${state.biz}/session/${a.name}/${f}`);
    addDay(msgs, f.replace(".jsonl", "").replace(/-(\d{2})(\d{2})(\d{2})$/, " $1:$2 UTC"));
    ev.forEach(e => addEvent(msgs, e));
  }
  const running = live.find(s => s.agent === a.name && !s.done);
  if (running) attach(running.id, msgs);
  msgs.scrollTop = msgs.scrollHeight;
  const box = $("#box"), send = $("#send");
  const go = async () => {
    const m = box.value.trim(); if (!m) return;
    send.disabled = true; box.value = "";
    const r = await post(`/biz/${state.biz}/chat`, { agent: a.name, message: m });
    if (r.error) { toast(r.error); send.disabled = false; return; }
    addDay(msgs, "now"); addEvent(msgs, { kind: "start", user: m }); attach(r.session, msgs);
  };
  send.onclick = go;
  box.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); go(); } };
  box.oninput = () => { box.style.height = "auto"; box.style.height = Math.min(160, box.scrollHeight) + "px"; };
}
function addDay(msgs, t) { const d = document.createElement("div"); d.className = "m day"; d.textContent = t; msgs.appendChild(d); }
function addEvent(msgs, e) {
  let d = document.createElement("div");
  if (e.kind === "start") { d.className = "m user"; d.textContent = e.user || ""; }
  else if (e.kind === "assistant") { if (!e.text) return; d.className = "m agent"; d.textContent = e.text; }
  else if (e.kind === "tool_call") {
    d.className = "m tool"; const a = e.args || {};
    d.innerHTML = `<span>${esc(e.name)}</span> <span class="muted">${esc(a.cmd || a.path || a.summary || "")}</span>` + (e.name === "write_file" ? `<div class="out">${esc((a.content || "").slice(0, 600))}</div>` : "");
  }
  else if (e.kind === "tool_result") {
    if (e.rc === 0 && e.name === "sh" && /^\(no output\)$/.test(e.output || "")) return;
    d.className = "m tool" + (e.rc ? " err" : ""); d.innerHTML = `<div class="out">${esc((e.output || "").slice(0, 700))}</div>`;
  }
  else if (e.kind === "end") { d.className = "m sys"; d.textContent = `ended: ${e.summary || ""} · ${e.turns || 0} turns`; }
  else if (e.kind === "learnings") { d.className = "m sys"; d.textContent = e.count ? `${e.count} learning${e.count === 1 ? "" : "s"} noted` : "nothing new learned"; }
  else if (e.kind === "error") { d.className = "m tool err"; d.textContent = e.error || "error"; }
  else return;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
}
function attach(sid, msgs) {
  if (state.live) state.live.close();
  const es = new EventSource(`/api/session/${sid}/events`); state.live = es;
  es.onmessage = ev => { const e = JSON.parse(ev.data); if (e.kind !== "start") addEvent(msgs, e); if (e.kind === "tool_result") refreshSideSoon(); };
  es.addEventListener("done", () => { es.close(); state.live = null; const s = $("#send"); if (s) s.disabled = false; refreshSide(); });
  es.onerror = () => { es.close(); state.live = null; const s = $("#send"); if (s) s.disabled = false; };
}
function showDoc(title, text) {
  const msgs = $("#msgs"); if (!msgs) return;
  const d = document.createElement("div"); d.className = "m agent"; d.style.maxWidth = "90%";
  d.innerHTML = `<div class="muted small" style="margin-bottom:6px">${esc(title)}</div><pre>${esc(text)}</pre>`;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
}

// ---------------------------------------------------------------- analytics
async function renderAnalytics(c) {
  const a = await api(`/biz/${state.biz}/analytics`);
  const p = document.createElement("div"); p.className = "pane"; c.appendChild(p);
  let h = "";
  const rep = a.report;
  if (rep && rep.weeks) {
    const rows = Object.entries(rep.metrics || {}).filter(([, cells]) => cells.some(x => x.value != null));
    h += `<h2>Weekly</h2>` + (rows.length ? `<table><tr><th>metric</th>${rep.weeks.map(w => `<th class="num">${w.slice(5)}</th>`).join("")}</tr>` +
      rows.map(([m, cells]) => `<tr><td>${esc(m)}</td>${cells.map(x => `<td class="num">${x.value == null ? "?" : (x.estimate ? "~" : "") + Number(x.value).toLocaleString()}</td>`).join("")}</tr>`).join("") + `</table>` : `<div class="empty">No readings yet.</div>`);
    if (rep.warnings && rep.warnings.length) h += `<div class="small" style="color:var(--accent);margin-top:8px">${rep.warnings.map(esc).join("<br>")}</div>`;
  } else h += `<h2>Weekly</h2><div class="empty">${esc(rep && rep.error || "no analytics")}</div>`;
  const ch = a.channels;
  h += `<h2>Channels, last 4 weeks</h2>`;
  if (ch && ch.channels && ch.channels.length) {
    h += `<table><tr><th>channel</th><th class="num">spend</th><th class="num">posts</th><th class="num">views</th><th class="num">engag.</th><th class="num">clicks</th><th class="num">leads</th><th class="num">signups</th><th class="num">cost/signup</th></tr>` +
      ch.channels.map(r => `<tr><td>${esc(r.channel)}</td><td class="num">${r.spend == null ? "0.00" : fmtMoney(r.spend)}</td><td class="num">${fmtV(r.posts)}</td><td class="num">${fmtV(r.post_views)}</td><td class="num">${fmtV(r.post_engagements)}</td><td class="num">${fmtV(r.post_clicks)}</td><td class="num">${fmtV(r.leads)}</td><td class="num">${fmtV(r.signups)}</td><td class="num">${r.cost_per_signup == null ? "?" : fmtMoney(Math.round(r.cost_per_signup))}</td></tr>`).join("") + `</table>`;
    const un = Object.entries(ch.unmatched || {}); if (un.length) h += `<div class="small" style="color:var(--accent);margin-top:8px">unmatched ledger channels: ${un.map(([k, v]) => `${esc(k)} ${fmtMoney(v)}`).join(", ")}</div>`;
  } else h += `<div class="empty">Nothing per channel in the window.</div>`;
  const posts = a.posts;
  h += `<h2>Posts</h2>`;
  if (Array.isArray(posts) && posts.length) {
    h += `<table><tr><th>post</th><th>channel</th><th>first</th><th class="num">views</th><th class="num">engag.</th><th class="num">clicks</th><th>title</th></tr>` +
      posts.map(r => `<tr><td class="small" style="font-family:var(--mono)">${esc(r.post)}</td><td>${esc(r.channel || "?")}</td><td>${esc(r.first)}</td><td class="num">${fmtV(r.post_views)}</td><td class="num">${fmtV(r.post_engagements)}</td><td class="num">${fmtV(r.post_clicks)}</td><td>${esc(r.title || "")}</td></tr>`).join("") + `</table>`;
  } else h += `<div class="empty">No post readings yet.</div>`;
  h += `<h2>What we believe</h2>` + renderMdTable(a.learnings || "");
  const rs = a.research;
  h += `<h2>Research</h2>`;
  if (Array.isArray(rs) && rs.length) {
    h += rs.map(r => `<details><summary>${esc(r.file)} <span class="muted">· ${esc(r.type || "")} · ${esc(r.applies || "")}</span><br><span class="muted small">${esc(r.question || "")}</span></summary><pre>${esc(a.research_files[r.file] || "")}</pre></details>`).join("");
  } else h += `<div class="empty">No research files yet.</div>`;
  p.innerHTML = h;
}
function renderMdTable(md) {
  const lines = md.split("\n").filter(l => l.trim().startsWith("|"));
  if (lines.length < 3) return `<div class="empty">No beliefs recorded yet.</div>`;
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(s => s.trim());
  const head = cells(lines[0]); const body = lines.slice(2).map(cells).filter(r => r.length === head.length);
  if (!body.length) return `<div class="empty">No beliefs recorded yet.</div>`;
  return `<table><tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>${body.map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</table>`;
}

// ---------------------------------------------------------------- money
async function renderMoney(c) {
  const f = await api(`/biz/${state.biz}/finance`);
  const p = document.createElement("div"); p.className = "pane"; c.appendChild(p);
  const r = f.report; let h = "";
  if (r && !r.error) {
    h += `<h2>${esc(r.period)} · ${esc(r.currency)} · ${esc(r.status)}</h2><table>`;
    h += `<tr><th>in</th><th class="num"></th></tr>` + Object.entries(r.in || {}).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${fmtMoney(v)}</td></tr>`).join("");
    h += `<tr><th>out</th><th class="num"></th></tr>` + Object.entries(r.out || {}).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${fmtMoney(v)}</td></tr>`).join("");
    h += `<tr><td><b>net</b></td><td class="num"><b>${fmtMoney(r.net)}</b></td></tr>`;
    if (r.payouts) h += `<tr><td>payouts to bank</td><td class="num">${fmtMoney(-r.payouts)}</td></tr>`;
    h += `</table>`;
  } else h += `<div class="empty">${esc(r && r.error || "no ledger")}</div>`;
  const rec = f.recurring;
  if (Array.isArray(rec) && rec.length) h += `<h2>Recurring</h2><table><tr><th>name</th><th class="num">amount</th><th>category</th><th>every</th><th>next</th></tr>` +
    rec.map(i => `<tr><td>${esc(i.name)}</td><td class="num">${fmtMoney(Math.round(i.amount * (i.share || 1)))} ${esc(i.currency)}</td><td>${esc(i.category)}</td><td>${esc(i.every)}</td><td>${esc(i.next_due || "-")}</td></tr>`).join("") + `</table>`;
  const ls = f.recent;
  h += `<h2>Recent</h2>` + (Array.isArray(ls) && ls.length ? `<table><tr><th>date</th><th class="num">amount</th><th>category</th><th>summary</th></tr>` +
    ls.map(e => `<tr><td>${esc(e.ts.slice(0, 10))}</td><td class="num">${fmtMoney(e.amount)} ${esc(e.currency)}</td><td>${esc(e.category)}</td><td>${esc(e.summary)}</td></tr>`).join("") + `</table>` : `<div class="empty">No entries.</div>`);
  p.innerHTML = h;
}

// ---------------------------------------------------------------- context
async function renderContext(c) {
  const files = await api(`/biz/${state.biz}/context`);
  const p = document.createElement("div"); p.className = "pane"; c.appendChild(p);
  p.innerHTML = Object.entries(files).map(([n, t]) => `<h2>${esc(n)}</h2><pre>${esc(t)}</pre>`).join("");
}

// ---------------------------------------------------------------- side rail
let sideT;
function refreshSideSoon() { clearTimeout(sideT); sideT = setTimeout(refreshSide, 800); }
async function refreshSide() {
  if (!state.biz) return;
  const [log, tasks, reqs, live] = await Promise.all([api(`/biz/${state.biz}/log?n=30`), api(`/biz/${state.biz}/tasks`), api(`/biz/${state.biz}/requests`), api(`/biz/${state.biz}/live`)]);
  $("#log").innerHTML = Array.isArray(log) && log.length ? log.map(e => `<div class="le"><div class="h"><span>${esc(e.ts.slice(5, 16).replace("T", " "))}</span><span class="tag ${esc(e.tag)}">${esc(e.tag)}</span><span>${esc(e.actor.replace(/^(agent|human|system):/, ""))}</span></div><div class="s">${esc(e.summary)}</div></div>`).join("") : `<div class="empty">Nothing logged yet.</div>`;
  const t = $("#tasks");
  if (Array.isArray(tasks) && tasks.length) {
    const by = {}; tasks.forEach(x => (by[x.owner] = by[x.owner] || []).push(x));
    t.innerHTML = Object.entries(by).map(([o, xs]) => `<div class="owner">${esc(o)}</div>` + xs.map(x => `<div class="task"><div class="t"><span>${esc(x.title)}</span><span class="st ${esc(x.status)}">${esc(x.status)}${x.due ? " · " + esc(x.due) : ""}</span></div><div class="id">${esc(x.id)}${x.tags.length ? " · " + esc(x.tags.join(", ")) : ""}</div></div>`).join("")).join("");
  } else t.innerHTML = `<div class="empty" style="padding:0 22px">No open tasks.</div>`;
  const r = $("#requests");
  r.innerHTML = Array.isArray(reqs) && reqs.length ? reqs.slice(0, 12).map(x => `<div class="req"><span><span class="dot ${x.executed ? "ok" : ""}"></span><span class="id">${esc(x.id)}</span></span><span class="muted">${esc(x.tool || "")}</span></div>`).join("") : `<div class="empty" style="padding:0 22px">No requests yet.</div>`;
  const running = live.filter(s => !s.done);
  $("#foot").innerHTML = running.length ? `<span class="dot on"></span>${running.length} session${running.length === 1 ? "" : "s"} running` : "quiet";
}
$("#gwbtn").onclick = async () => { $("#gwbtn").disabled = true; const r = await post(`/biz/${state.biz}/gateway`, {}); toast(r.error || (r.out || "").split("\n").slice(-1)[0] || "done"); $("#gwbtn").disabled = false; refreshSide(); };
$("#taskbtn").onclick = async () => {
  const title = prompt("Task title"); if (!title) return;
  const b = state.bizs.find(x => x.slug === state.biz);
  const owner = prompt("Owner (agent:name or human:name)", b && b.agents[0] ? "agent:" + b.agents[0] : "human:owner") || "";
  const r = await post(`/biz/${state.biz}/task`, { title, owner }); toast(r.error || `added ${r.id}`); refreshSide();
};
setInterval(refreshSide, 12000);
loadBiz();
</script>
</body>
</html>
