<script>
// Stubs for the dashboard around the Browser panel: the real agent-browser.js (the open-tab entry point and the Browser mount) and
// the real agent-browser-live.js (the live view) run against a stubbed API, EventSource and agent navigation. The navigation stub
// does what the real one ends in for a plain pane: leave the old view, then mount Browser.
const esc = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('"', '&quot;');
const $ = (selector, root = document) => root.querySelector(selector);
const coreData = value => value;
const AGENT = '3f6c1b9e-2a47-4d1e-9b0c-5e8a7d2c4f10', A = 'A'.repeat(32), B = 'B'.repeat(32), C = 'C'.repeat(32), GONE = 'D'.repeat(32);
const storage = new Map(), ls = (key, value) => { if (value === undefined) return storage.get(key) ?? null; storage.set(key, value); };
const state = {scope: 'global', globalTab: 'agents'};
const toasts = [], toast = message => toasts.push(message);
let configured = false, tabs = [{id: A, title: 'Inbox', url: 'https://mail.example/'}, {id: B, title: 'Captcha', url: 'https://shop.example/'}];
const api = async path => path.endsWith('/browser-surfaces')
  ? {agent_id: AGENT, configured, browsers: configured ? [{id: 'shared', kind: 'browser', label: 'Shared', viewer_url: 'about:blank'}] : [], desktop: null}
  : {agent_id: AGENT, tabs};
const post = async () => ({}), evUrl = path => '/api' + path;
const sources = [];
window.EventSource = class extends EventTarget {
  constructor(url) { super(); this.url = url; this.closed = false; sources.push(this); }
  close() { this.closed = true; }
};
const agfocusURL = value => typeof value === 'string' ? value : null, agfocusDesktopURL = url => ({url, width: 800, height: 600}), agfocusDesktopFrameFit = () => {};
const T_VIEW_ICON = {}, identityAvatar = () => '';
const agpadActive = () => true;
const pane = {agentId: AGENT, views: ['focus', 'browser'], workspaceScope: 'global', workspaceRole: 'global-worker', el: document.getElementById('pane'), view: 'focus', browserRequest: 0};
let _agpad = pane;
const syncs = [];
const agpadWorkspaceViewsSync = p => { syncs.push(p.agentId); if (!p.views.includes('browser')) p.views.push('browser'); };
const navigations = [];
let navigate = async (id, options) => {
  navigations.push([id, options.view]);
  if (id !== AGENT) return false;
  pane.workspaceDispose?.(); pane.workspaceDispose = null;
  pane.view = options.view;
  agbrowserMount(pane);
  return true;
};
const globalAgentsNavigate = (id, options) => navigate(id, options);
let roster = [{agent_id: AGENT, status: 'active'}];
const loadGlobalAgentProfiles = async () => roster, globalRosterAgent = agent => agent.status === 'active';
const selectGlobal = async () => { state.scope = 'global'; state.globalTab = 'agents'; };
</script>

<script>
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const settle = () => wait(150);
const watched = () => {
  const live = sources.filter(source => !source.closed);
  return {open: live.map(source => new URL(source.url, 'http://x').searchParams.get('tab')), picker: $('[data-live-tabs]')?.value ?? null,
    live: !!$('[data-live-screen]'), configuredFrame: !!$('.agbrowser-frame'), text: $('#agpad-body').textContent.trim().slice(0, 80)};
};
const reset = () => {
  pane.workspaceDispose?.(); pane.workspaceDispose = null; pane.surfaces = null; pane.view = 'focus';
  sources.length = 0; navigations.length = 0; toasts.length = 0; syncs.length = 0;
  agbrowserTabWanted = null; configured = false; $('#agpad-body').replaceChildren();
};
const plain = async () => { pane.workspaceDispose?.(); pane.workspaceDispose = null; pane.view = 'browser'; agbrowserMount(pane); await settle(); return watched(); };
(async () => {
  const out = {};
  // Cold: no live view yet. The navigation is asked for the agent's Browser mode; the live view opens on the requested tab, not the first.
  out.cold = {result: await agentBrowserOpenTab(AGENT, B), ...(await settle(), watched()), navigations: [...navigations], consumed: agbrowserTabWanted === null, toasts: [...toasts]};
  // Already open on another tab: the same entry point switches the one live view; the old stream is closed.
  reset();
  out.baseline = await plain();
  const before = sources.length;
  out.switched = {result: await agentBrowserOpenTab(AGENT, B), ...(await settle(), watched()), streams: sources.length - before, firstClosed: sources[0].closed};
  // The request is spent by the mount it caused: a later ordinary open of Browser is the usual one (first page), not the old tab.
  out.afterwards = await plain();
  // A tab that has gone by then leaves the live view's usual choice; nothing is shown as an error and nothing sticks.
  reset();
  out.gone = {result: await agentBrowserOpenTab(AGENT, GONE), ...(await settle(), watched()), toasts: [...toasts]};
  // A request nobody served (the owner left the unsaved-changes prompt, or the mount came late) does not steer a later open.
  reset();
  navigate = async id => { navigations.push([id, 'cancelled']); return false; };
  _agpad = {agentId: 'someone-else', views: []};
  out.cancelled = {result: await agentBrowserOpenTab(AGENT, B), spent: agbrowserTabWanted === null, toasts: [...toasts]};
  _agpad = pane;
  reset();
  const realNow = Date.now;
  navigate = async (id, options) => { Date.now = () => realNow() + 60000; pane.view = options.view; agbrowserMount(pane); return true; };
  await agentBrowserOpenTab(AGENT, B); await settle(); Date.now = realNow;
  out.late = watched();
  navigate = async (id, options) => {
    navigations.push([id, options.view]);
    if (id !== AGENT) return false;
    pane.workspaceDispose?.(); pane.workspaceDispose = null; pane.view = options.view; agbrowserMount(pane); return true;
  };
  // The agent is not one this dashboard shows, or the ids are not well-formed: nothing is navigated; only the first says so.
  reset();
  roster = [];
  out.unknownAgent = {result: await agentBrowserOpenTab(AGENT, B), navigations: [...navigations], toasts: [...toasts], wanted: agbrowserTabWanted};
  roster = [{agent_id: AGENT, status: 'active'}];
  reset();
  out.badIds = [];
  for (const args of [[AGENT, 'b'.repeat(32)], [AGENT, B + 'B'], [AGENT, null], ['', B], [null, B], [[AGENT], B]]) out.badIds.push(await agentBrowserOpenTab(...args));
  out.badIdsEffects = {navigations: navigations.length, toasts: toasts.length, wanted: agbrowserTabWanted};
  // The pane has not offered Browser yet (its discovery ran before the agent's browser started): it is offered now.
  reset();
  pane.views = ['focus'];
  out.undiscovered = {result: await agentBrowserOpenTab(AGENT, B), views: [...pane.views], live: pane.liveBrowser === true, syncs: [...syncs], ...(await settle(), watched())};
  // A viewer configured for the agent does not hide its built-in browser when a tab is asked for; an ordinary open still shows the viewer.
  reset();
  configured = true;
  out.configuredPlain = await plain();
  reset();
  configured = true;
  out.configuredTab = {result: await agentBrowserOpenTab(AGENT, B), ...(await settle(), watched())};
  document.getElementById('out').textContent = JSON.stringify(out);
})();
</script>
