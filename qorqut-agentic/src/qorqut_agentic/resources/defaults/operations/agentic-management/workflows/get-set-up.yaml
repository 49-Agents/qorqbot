schema_version: 1
id: get-set-up
description: One short conversation in which Ordubashy asks the owner a few optional questions in one set-up form, records the basic facts and connects the tools the owner chose.
arguments: []
steps:
  - id: about-you
    instruction_ref: agentic-management/onboarding-about-you
  - id: connect-tools
    instruction_ref: agentic-management/onboarding-connect-tools
    depends_on: [about-you]
  - id: wrap-up
    instructions: >-
      Tell the owner in a few lines what you now know about them, which tools are connected and what is
      still open. Report only what the two earlier steps actually saved or confirmed. Say that they can ask
      you anytime to show or change what you saved about them, and that connected websites are listed in
      Settings under Connections. Ask what they would like to start with. Complete this step with an open_items output listing what is still open (an
      empty list when nothing is), then complete the Task behind this run.
    depends_on: [about-you, connect-tools]
