[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qorqut-agentic"
version = "0.2.0"
description = "Standalone agentic layer: authored skills, tools and workflows with Git history, a durable change feed and a JSON CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
qorqut-agentic = "qorqut_agentic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qorqut_agentic = ["py.typed", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
