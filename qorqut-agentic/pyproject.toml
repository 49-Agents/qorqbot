[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "RELEASE-LICENSES.json"]
name = "qorqut-agentic"
version = "0.2.0"
description = "Standalone agentic layer: authored skills, tools and workflows with Git history, a durable change feed and a JSON CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "psutil>=6.0; sys_platform == 'darwin'",
]

[project.scripts]
qorqut-agentic = "qorqut_agentic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qorqut_agentic = ["py.typed", "resources/**/*", "resources/defaults/plugins/.gitkeep", "resources/defaults/operations/source-instructions/host/app/templates/plugins/basic/.gitignore"]
