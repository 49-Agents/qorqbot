[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "RELEASE-LICENSES.json"]
name = "qorqut-engine-email"
version = "0.2.0"
description = "Fastmail JMAP synchronization and approved account email execution"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.13,<3", "starlette>=1,<2", "uvicorn>=0.52,<1", "cryptography>=46,<51"]

[tool.setuptools.packages.find]
include = ["engine_email*"]

[tool.setuptools.package-data]
engine_email = ["*.mjs", "package.json", "package-lock.json"]
