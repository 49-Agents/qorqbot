[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "RELEASE-LICENSES.json"]
name = "qorqut-fastmail"
version = "0.2.1"
description = "Optional Fastmail mail and calendar provider for a Qorqbot host"
readme = "README.md"
requires-python = ">=3.12"
# The host (import package ``bazarlyk``) supplies the extension API and Operations engine. The provider reaches the separate
# email engine only through its account HTTP protocol, never through an import; ``icalendar`` serves the CalDAV calendar adapter.
dependencies = ["bazarlyk-core==1.3.0.dev0", "httpx>=0.27,<1", "icalendar>=7.2,<8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qorqut_fastmail*"]

# The guide is supplied by Agentic; only this selected extension binds it and loads these approval assets.
[tool.setuptools.package-data]
qorqut_fastmail = ["resources/index.json", "assets/*.js", "assets/*.css"]
