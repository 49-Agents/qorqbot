[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qorqut-fastmail"
version = "0.1.0"
description = "Optional Fastmail mail and calendar provider for a Qorqbot host"
readme = "README.md"
requires-python = ">=3.12"
# The host (import package ``bazarlyk``) supplies the extension API and Operations engine. The provider reaches the separate
# email engine only through its account HTTP protocol, never through an import; ``icalendar`` serves the CalDAV calendar adapter.
dependencies = ["bazarlyk-core==1.3.0.dev0", "httpx>=0.27,<1", "icalendar>=7.2,<8"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qorqut_fastmail*"]

# The Email Management provider guide ships as package data. Nothing installs or injects it into an
# instance automatically; a later optional installer copies it without overwriting an authored file.
[tool.setuptools.package-data]
qorqut_fastmail = ["resources/email-management/providers/*.md"]
