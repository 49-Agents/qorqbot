:root { --paper: #FAF8F4; --ink: #1A1A1A; --bar: 40px; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #ECE9E3; }
#viewport { position: fixed; left: 0; top: 0; right: 0; bottom: var(--bar); overflow: hidden; }
body.no-controls #viewport { bottom: 0; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; margin: -540px 0 0 -960px;
  overflow: hidden; background: var(--paper); transform-origin: 50% 50%; visibility: hidden; }
#art { display: block; width: 1920px; height: 1080px; text-rendering: geometricPrecision;
  font-family: "Zen Kaku Gothic New", system-ui, sans-serif; }

#controls { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bar); box-sizing: border-box;
  display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #F4F1EB;
  border-top: 1px solid rgba(26, 26, 26, .10); color: var(--ink);
  font: 12px/1 "Zen Kaku Gothic New", system-ui, sans-serif; user-select: none; }
body.no-controls #controls { display: none; }
#controls button { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: transparent;
  color: inherit; display: grid; place-items: center; cursor: pointer; }
#controls button:hover { background: rgba(26, 26, 26, .07); }
#controls button:focus-visible, #seek:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
#controls svg { width: 14px; height: 14px; fill: currentColor; }
#btnPlay .i-pause, #btnPlay[data-state="playing"] .i-play { display: none; }
#btnPlay[data-state="playing"] .i-pause { display: block; }
#seek { flex: 1; min-width: 60px; margin: 0 6px; accent-color: var(--ink); cursor: pointer; }
#time { min-width: 76px; text-align: right; font-variant-numeric: tabular-nums; opacity: .72; }
</style>

      [24.6, [CAM1.s, CAM1.x]], [26.4, [CAM2.s, CAM2.x], 'release']]);
    track('camY', [[0, CAM0.y], [9.0, CAM0.y], [11.4, CAM1.y, 'release'], [19.1, CAM1.y], [20.7, CAM1.y - ROW_PAN, 'release'],
      [24.6, CAM1.y - ROW_PAN], [26.4, CAM2.y, 'release']]);
    track('grid', [[0, 1], [24.6, 1], [26.4, 0.45, 'power1.inOut']]);

    // 0–5 · slide-04 composition; the arrows draw one at a time and the mascot glances at each
    track('hScale', [[0, 1], [9.0, 1], [11.4, 0.84, 'release']]);
    track('hBase', [[0, 198.4], [9.0, 198.4], [11.4, 172, 'release']]);
    track('hA', [[0, 1], [12.2, 1], [12.65, 0, 'power2.in']]);
    track('hAdy', [[0, 0], [12.2, 0], [12.65, -10, 'power2.in']]);
    track('arrow0', [[0, 0], [0.6, 0], [1.8, 1]]);
    track('arrow1', [[0, 0], [1.4, 0], [2.6, 1]]);
    track('arrow2', [[0, 0], [2.2, 0], [3.4, 1]]);
    CARDS.forEach((c, i) => track('arrowOp' + i, [[0, 1], [7.7 + 0.3 * i, 1], [8.6 + 0.3 * i, 0, 'power1.inOut']]));
    track('iconsOp', [[0, 1], [9.0, 1], [9.9, 0, 'power1.inOut']]);

    const F = [FACE.x, FACE.y];
    const gTop = gazeTo(F, [961, 411]), gMid = gazeTo(F, [906, 567]), gBot = gazeTo(F, [947, 715]);
    const gStack = gazeTo(F, [836, 590]);
    const gSat = AGENTS.map((a) => gazeTo(FACE_C1, a.orbit));
    const gOut = gazeTo(FACE_C1, [GLYPH.x + 60, GLYPH.y]);
    track2(['gx', 'gy'], [
      [0, [0, 0]], [1.45, [0, 0]], [1.8, gTop], [2.25, gTop], [2.6, gMid], [3.05, gMid], [3.4, gBot], [4.0, gBot],
      [4.4, [0, 0]], [5.7, [0, 0]], [6.1, gStack], [9.2, gStack], [9.6, [0, 0]],
      // 12–19 · the face follows each pulse out to its agent
      [14.75, [0, 0]], [15.0, gSat[0]], [15.25, gSat[0]], [15.5, gSat[1]], [15.8, gSat[1]], [16.05, gSat[2]],
      [16.35, gSat[2]], [16.6, gSat[3]], [17.3, gSat[3]], [17.7, [0, 0]],
      // 19–24 · watches the result leave the stack and land in the chat row
      [20.35, [0, 0]], [20.65, gStack], [20.95, gStack], [21.35, gOut], [23.6, gOut], [24.0, [0, 0]],
      // endcard · looks toward the headline
      [26.2, [0, 0]], [26.6, [4.37, -0.85]],
    ]);
    track('blink', [[0, 1], ...blink(4.5), ...blink(11.9), ...blink(28.9)]);

    // 5–12 · three context cards leave the icons, follow the paths and stack beside the face
    CARDS.forEach((c, i) => track('card' + i, [[0, 0], [5.0 + 0.25 * i, 0], [5.6 + 0.25 * i, 1, 'power2.out'],
      [5.75 + 0.3 * i, 1], [8.15 + 0.3 * i, 2, 'sine.inOut']]));
    track('wsDraw', [[0, 0], [10.0, 0], [11.6, 1, 'power2.inOut']]);
    track('wsFill', [[0, 0], [11.0, 0], [11.9, 1, 'power1.inOut']]);

    // 12–19 · satellites, fan-out lines, sequential pulses, provider marks
    track('hB', [[0, 0], [12.55, 0], [13.25, 1, 'power2.out'], [19.0, 1], [19.5, 0, 'power2.in']]);
    track('hBdy', [[0, 12], [12.55, 12], [13.25, 0, 'hero'], [19.0, 0], [19.5, -8, 'power2.in']]);
    const APPEAR = [0, 0.4, 0.2, 0.6];                  // Mike, Turgut, Adam, Borte — alternating sides
    const LINE = [0, 0.3, 0.15, 0.45];
    const PULSE = [[14.8, 0.9], [15.3, 0.9], [15.8, 1.1], [16.35, 1.1]];
    const MOVE = [0.06, 0.18, 0, 0.12];
    AGENTS.forEach((a, i) => {
      const t0 = 12.5 + APPEAR[i];
      track('satIn' + i, [[0, 0], [t0, 0], [t0 + 0.6, 1, 'hero']]);
      track('satLabel' + i, [[0, 0], [t0 + 0.2, 0], [t0 + 0.7, 1, 'power2.out'], [19.0, 1], [19.4, 0, 'power2.in']]);
      track('line' + i, [[0, 0], [13.5 + LINE[i], 0], [14.45 + LINE[i], 1]]);
      const [ps, pd] = PULSE[i], arrive = ps + pd;
      track('pulse' + i, [[0, 0], [ps, 0], [arrive, 1, 'power1.inOut']]);
      track('mark' + i, [[0, 0], [arrive, 0], [arrive + 0.4, 1, 'power2.out'], [19.0, 1], [19.4, 0, 'power2.in']]);
      track('breath' + i, [[0, 0], [arrive, 0], [arrive + 0.42, 1, 'inhale'], [arrive + 1.0, 0, 'release']]);
      track('glance' + i, [[0, 0], [arrive - 0.1, 0], [arrive + 0.25, 1], [arrive + 1.2, 1], [arrive + 1.55, 0]]);
      track('satMove' + i, [[0, 0], [19.35 + MOVE[i], 0], [20.75 + MOVE[i], 1, 'hero']]);
    });
    track('lineRetract', [[0, 0], [19.0, 0], [19.7, 1, 'power2.in']]);

    // 19–24 · compact dark chat row; the result resolves from the stack as a file card
    track('rowIn', [[0, 0], [19.55, 0], [20.35, 1, 'hero']]);
    track('outAppear', [[0, 0], [20.25, 0], [20.6, 1, 'power2.out']]);
    track('outMove', [[0, 0], [20.6, 0], [21.4, 1, 'hero']]);
    track('fcIn', [[0, 0], [21.3, 0], [21.85, 1, 'hero']]);
    track('fcT1', [[0, 0], [21.55, 0], [22.05, 1, 'power2.out']]);
    track('fcT2', [[0, 0], [21.8, 0], [22.3, 1, 'power2.out']]);
    track('satLook', [[0, 0], [20.95, 0], [21.35, 1], [23.8, 1], [24.0, 0]]);

    // 24–30 · the diagram contracts into the mascot; the endcard settles beside it
    track('kRow', [[0, 0], [24.0, 0], [25.1, 1]]);
    track('kStack', [[0, 0], [24.15, 0], [25.2, 1]]);
    track('kWs', [[0, 0], [24.3, 0], [25.4, 1]]);
    track('ec1', [[0, 0], [25.8, 0], [26.6, 1, 'hero']]);
    track('ec2', [[0, 0], [26.05, 0], [26.85, 1, 'hero']]);
    track('ec3', [[0, 0], [26.6, 0], [27.2, 1, 'power2.out']]);
    track('ec4', [[0, 0], [26.9, 0], [27.5, 1, 'power2.out']]);
  }

  /* ---------------------------------------------------------------- render */
  function setDash(path, len, d) {
    if (d <= 0.0005) { path.setAttribute('visibility', 'hidden'); path.removeAttribute('stroke-dasharray'); return; }
    path.setAttribute('visibility', 'visible');
    if (d >= 0.9995) path.removeAttribute('stroke-dasharray');
    else path.setAttribute('stroke-dasharray', `${n2(len * d)} ${n2(len + 20)}`);
  }
  const towards = (cx, cy, k) => `translate(${n2(cx)} ${n2(cy)}) scale(${n5(1 - 0.92 * k)}) translate(${n2(-cx)} ${n2(-cy)})`;

  function render() {
    world.setAttribute('transform', `matrix(${n5(S.camS)} 0 0 ${n5(S.camS)} ${n2(S.camX)} ${n2(S.camY)})`);
    R.gridRect.setAttribute('opacity', n5(S.grid));

    // headline
    R.headline.setAttribute('transform', `translate(960 ${n2(S.hBase)}) scale(${n5(S.hScale)}) translate(-960 -198.4)`);
    setAttrs(R.hA, { opacity: n5(S.hA), transform: `translate(0 ${n2(S.hAdy)})` });
    setAttrs(R.hB, { opacity: n5(S.hB), transform: `translate(0 ${n2(S.hBdy)})` });

    // slide-04 arrows and icons
    ARROWS.forEach((a, i) => {
      const d = S['arrow' + i];
      setDash(a.path, a.len, d);
      a.path.setAttribute('opacity', n5(S['arrowOp' + i]));
      a.head.setAttribute('opacity', n5(smooth(0.92, 1, d) * S['arrowOp' + i]));
    });
    R.icons.setAttribute('opacity', n5(S.iconsOp));

    // mascot gaze and blink
    heroGaze.setAttribute('transform', `translate(${n2(S.gx)} ${n2(S.gy)})`);
    heroEyes.forEach((e) => e.setAttribute('transform', `scale(1 ${n5(S.blink)})`));

    // context cards: emerge from behind the icon (q 0..1), follow the path and settle in the stack (q 1..2)
    CARDS.forEach((c, i) => {
      const q = S['card' + i];
      if (q <= 0) { setAttrs(c.g, { opacity: 0, transform: `translate(${c.icon[0]} ${c.icon[1]}) rotate(0) scale(0.55)` }); return; }
      let x, y, rot = 0, sc = 1, op = 1;
      if (q <= 1) {
        x = lerp(c.icon[0], c.start.x, q); y = lerp(c.icon[1], c.start.y, q);
        sc = 0.55 + 0.45 * q; op = clamp(q * 2.5);
      } else {
        const p = q - 1, along = lerp(44, c.len * 0.7, p);
        const pt = c.path.getPointAtLength(along), ahead = c.path.getPointAtLength(Math.min(c.len, along + 2));
        const w = smooth(0.35, 1, p);
        x = lerp(pt.x, c.slot[0], w); y = lerp(pt.y, c.slot[1], w);
        rot = Math.atan2(ahead.y - pt.y, ahead.x - pt.x) * 180 / Math.PI * 0.18 * (1 - w);
      }
      setAttrs(c.g, { opacity: n5(op), transform: `translate(${n2(x)} ${n2(y)}) rotate(${n2(rot)}) scale(${n5(sc)})` });
    });
    setAttrs(R.stack, { transform: towards(FACE.x, FACE.y, S.kStack), opacity: n5(1 - smooth(0.3, 0.85, S.kStack)) });

    // workspace boundary: draws clockwise, later tightens into a ring round the face and fades
    const k = S.kWs;
    const wx = lerp(WS.x, FACE.x - WS_RING, k), wy = lerp(WS.y, FACE.y - WS_RING, k);
    const ww = lerp(WS.w, WS_RING * 2, k), wh = lerp(WS.h, WS_RING * 2, k), wr = lerp(WS.rx, WS_RING, k);
    const geo = { x: n2(wx), y: n2(wy), width: n2(ww), height: n2(wh), rx: n2(wr) };
    const fade = 1 - smooth(0.6, 1, k);
    setAttrs(R.wsFill, { ...geo, opacity: n5(S.wsFill * fade) });
    setAttrs(R.wsLine, { ...geo, opacity: n5(fade) });
    setDash(R.wsLine, 2 * (ww + wh) - (8 - 2 * Math.PI) * wr, S.wsDraw);

    // fan-out lines, pulses, satellites
    const retract = S.lineRetract;
    FAN.forEach((f, i) => {
      const draw = S['line' + i];
      setDash(f.line, f.len, Math.min(draw, 1 - retract));
      f.head.setAttribute('opacity', n5(smooth(0.92, 1, draw) * (1 - smooth(0, 0.25, retract))));
      const p = S['pulse' + i];
      if (p <= 0 || p >= 1) {
        setAttrs(f.pulse, { visibility: 'hidden', opacity: 0, 'stroke-dasharray': 'none', 'stroke-dashoffset': 0 });
        return;
      }
      const seg = 34;
      setAttrs(f.pulse, {
        visibility: 'visible', 'stroke-dasharray': `${seg} ${n2(f.len + seg)}`,
        'stroke-dashoffset': n2(-p * (f.len - seg)), opacity: n5(smooth(0, 0.08, p) * (1 - smooth(0.9, 1, p))),
      });
    });
    SATS.forEach((s, i) => {
      const a = AGENTS[i], appear = S['satIn' + i], mv = S['satMove' + i];
      const [x, y] = mv > 0 ? cubicAt(s.movePath, mv) : a.orbit;
      const sc = (0.9 + 0.1 * appear) * lerp(1, ROW_R / SAT_R, mv) * (1 + 0.06 * S['breath' + i]);
      setAttrs(s.g, { opacity: n5(appear), transform: `translate(${n2(x)} ${n2(y)}) scale(${n5(sc)})` });
      s.label.setAttribute('opacity', n5(S['satLabel' + i]));
      s.markG.setAttribute('opacity', n5(S['mark' + i]));
      const gl = S['glance' + i], look = S.satLook;
      s.gaze.setAttribute('transform', `translate(${n2(s.glance[0] * gl + 4.3 * look)} ${n2(s.glance[1] * gl + 0.4 * look)})`);
    });

    // dark chat row, the resolved checklist, and the file card
    const rowW = ROW.w * (0.5 + 0.5 * S.rowIn);
    setAttrs(R.rowPanel, { x: n2(ROW.cx - rowW / 2), width: n2(rowW), opacity: n5(S.rowIn) });
    const oa = S.outAppear, om = S.outMove;
    {
      const [ox, oy] = om > 0 ? cubicAt(OUT_PATH, om) : [STACK_FRONT_C1[0], STACK_FRONT_C1[1] - OUT_LIFT * oa];
      const osc = om > 0 ? lerp(CAM1.s, CAM1.s * GLYPH.s, om) : CAM1.s * (0.94 + 0.06 * oa);
      setAttrs(outDoc, { opacity: n5(oa), transform: `translate(${n2(ox)} ${n2(oy)}) scale(${n5(osc)})` });
    }
    R.fileCard.setAttribute('opacity', n5(clamp(S.fcIn * 5)));
    R.fileBody.setAttribute('width', n2(lerp(CARD.w0, CARD.w, S.fcIn)));
    setAttrs(R.fileTitle, { opacity: n5(S.fcT1), transform: `translate(${n2((1 - S.fcT1) * 10)} 0)` });
    setAttrs(R.fileLine, { opacity: n5(S.fcT2), transform: `translate(${n2((1 - S.fcT2) * 10)} 0)` });
    const rowT = towards(FACE_C1[0], FACE_C1[1], S.kRow), rowOp = n5(1 - smooth(0.2, 0.75, S.kRow));
    setAttrs(R.rowAll, { transform: rowT, opacity: rowOp });
    setAttrs(R.sats, { transform: rowT, opacity: rowOp });

    // endcard
    [['ec1', 18], ['ec2', 18], ['ec3', 10], ['ec4', 10]].forEach(([id, rise]) => {
      setAttrs(R[id], { opacity: n5(S[id]), transform: `translate(0 ${n2((1 - S[id]) * rise)})` });
    });
  }

  /* ------------------------------------------------------- controls + API */
  const btnPlay = $('btnPlay'), btnRestart = $('btnRestart'), seekEl = $('seek'), timeEl = $('time');
  let lastUI = '';
  function syncUI() {
    if (!tl) return;
    const t = tl.time(), playing = !tl.paused() && t < DURATION;
    const key = `${t.toFixed(2)}|${playing}`;
    if (key === lastUI) return;
    lastUI = key;
    seekEl.value = t.toFixed(2);
    timeEl.textContent = `${t.toFixed(1)} / ${DURATION.toFixed(1)}`;
    btnPlay.dataset.state = playing ? 'playing' : 'paused';
  }
  function frame() { render(); syncUI(); }

  function seek(t) {
    let v = Number(t);
    if (!Number.isFinite(v)) v = 0;
    v = clamp(v, 0, DURATION);
    tl.pause();
    tl.time(v, true);
    frame();
  }
  function play() {
    if (tl.time() >= DURATION - 1e-3) tl.time(0, true);
    tl.play();
    frame();
  }
  function pause() { tl.pause(); frame(); }
  function restart() { tl.pause(); tl.time(0, true); tl.play(); frame(); }

  function fit() {
    const vp = $('viewport');
    const s = Math.min(vp.clientWidth / 1920, vp.clientHeight / 1080) || 1;
    stage.style.transform = `scale(${s})`;
  }

  const withTimeout = (p, ms) => Promise.race([p, new Promise((r) => setTimeout(r, ms))]);
  async function loadFonts() {
    if (!document.fonts || !document.fonts.load) return;
    const faces = [300, 400, 500].map((w) => `${w} 100px "Zen Kaku Gothic New"`);
    try {
      await withTimeout(Promise.all(faces.map((f) => document.fonts.load(f, 'qorqbot Github'))), 4000);
      await withTimeout(document.fonts.ready, 2000);
      faces.forEach((f) => { if (!document.fonts.check(f)) errors.push('font not loaded: ' + f); });
    } catch (e) { errors.push('fonts: ' + ((e && e.message) || e)); }
  }

  async function boot() {
    const params = new URLSearchParams(location.search);
    if (params.get('controls') === '0') document.body.classList.add('no-controls');
    fit();
    addEventListener('resize', fit);
    if (typeof gsap === 'undefined' || typeof CustomEase === 'undefined') {
      errors.push('GSAP runtime missing');
      return;
    }
    await loadFonts();
    try {
      build();
      buildTimeline();
    } catch (e) {
      errors.push('build: ' + ((e && e.message) || e));
      return;
    }
    // prime pass (49IDE stage.js): render end then start so every tween is initialised
    tl.progress(1, true).progress(0, true);
    frame();
    Object.assign(api, { play, pause, restart, seek });

    btnPlay.addEventListener('click', () => (tl.paused() || tl.time() >= DURATION ? play() : pause()));
    btnRestart.addEventListener('click', restart);
    seekEl.addEventListener('input', () => seek(seekEl.value));
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.type !== 'qorqbot-animation') return;
      if (e.source !== window.parent && e.source !== window) return;
      if (d.action === 'play') play();
      else if (d.action === 'pause') pause();
      else if (d.action === 'restart') restart();
      else if (d.action === 'seek') seek(d.time);
    });

    const pausedParam = params.has('paused') && !/^(0|false)$/i.test(params.get('paused') || '');
    if (params.has('t')) seek(params.get('t'));
    else if (pausedParam) seek(0);
    else if (matchMedia('(prefers-reduced-motion: reduce)').matches) seek(REDUCED_MOTION_T);
    else restart();

    stage.style.visibility = 'visible';
    api.ready = true;
    if (window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'qorqbot-animation-ready', id: ID, duration: DURATION }, '*'); }
      catch (e) { errors.push('ready message: ' + ((e && e.message) || e)); }
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
