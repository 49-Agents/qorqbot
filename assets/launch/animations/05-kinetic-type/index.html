:root{--paper:#FAF8F4;--ink:#1A1A1A;--bar:44px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#E9E6E0}
body{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#frame{position:absolute;left:0;right:0;top:0;bottom:var(--bar);overflow:hidden}
body.no-controls #frame{bottom:0}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;visibility:hidden;background:var(--paper)}
#stage .scene{position:absolute;left:0;top:0;width:1920px;height:1080px}
#stage .layer{position:absolute;left:0;top:0;overflow:visible}
#stage .wrap{position:absolute;width:0;height:0}
#stage .mask{position:absolute;overflow:hidden}
#stage .type{position:absolute;white-space:nowrap;line-height:1;font-kerning:normal}
#stage .face,#stage .mark,#stage .mascot,#stage .icon{position:absolute;display:block}
#stage .face svg,#stage .mark svg,#stage .mascot svg{display:block;overflow:visible}
#stage .peek{position:absolute;overflow:hidden}
#stage .panel{position:absolute;background:#161616;border-radius:16px;box-shadow:0 26px 60px rgba(26,26,26,.14),0 6px 14px rgba(26,26,26,.08)}
#stage .bar{position:absolute;background:var(--ink)}
#stage .ui{position:absolute}
#stage .ui-shadow{position:absolute;inset:0;border-radius:14px;box-shadow:0 18px 44px rgba(26,26,26,.16),0 4px 10px rgba(26,26,26,.08)}
#stage .ui-panel{position:absolute;inset:0;border-radius:14px;overflow:hidden;background-size:100% 100%}
#stage .crop{position:absolute;background-size:100% 100%}
#stage .block{position:absolute;left:0;top:0;width:0;height:0}
#stage .skin{position:absolute;border-radius:6px;background-repeat:no-repeat}
#stage .lifted{box-shadow:0 16px 34px rgba(26,26,26,.24),0 3px 8px rgba(26,26,26,.12)}
#stage .rule{position:absolute;height:1.5px;background:var(--ink)}
#stage .cta{position:absolute;padding:19px 36px 21px;border:1px solid #161616;border-radius:999px;background:linear-gradient(160deg,#484644 0%,#272625 45%,#171717 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.33),0 3px 5px rgba(26,26,26,.07),0 9px 21px rgba(26,26,26,.13);color:var(--paper);font-size:22px;font-weight:400;line-height:1;letter-spacing:.01em;white-space:nowrap}
#controls{position:absolute;left:0;right:0;bottom:0;height:var(--bar);display:flex;align-items:center;gap:10px;padding:0 14px;background:#1A1A1A;color:#FAF8F4;font-size:13px;font-weight:500;user-select:none}
body.no-controls #controls{display:none}
#controls button{width:30px;height:30px;padding:0;border:0;border-radius:15px;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center}
#controls button:hover{background:rgba(250,248,244,.1)}
#controls button:focus-visible,#controls input:focus-visible{outline:2px solid #FAF8F4;outline-offset:2px}
#controls svg{width:16px;height:16px;fill:currentColor}
#c-play .i-pause,#c-play.is-playing .i-play{display:none}
#c-play.is-playing .i-pause{display:block}
#c-seek{flex:1;min-width:80px;accent-color:#FAF8F4;cursor:pointer}
#c-time{min-width:84px;text-align:right;font-variant-numeric:tabular-nums;opacity:.8}
</style>
</head>
<body>
<div id="frame"><div id="stage" aria-label="Qorqbot launch animation: get stuff done, stay independent"></div></div>
<div id="controls" role="toolbar" aria-label="Animation preview controls">
  <button id="c-play" type="button" aria-label="Play"><svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg><svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg></button>
  <button id="c-restart" type="button" aria-label="Restart"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7l1.4.5A4 4 0 1 0 8 4h-.6l1.8 1.8-1 1L4.6 3.2 8.2-.4l1 1L7.6 2.5z"/></svg></button>
  <input id="c-seek" type="range" min="0" max="28" step="0.01" value="0" aria-label="Seek">
  <output id="c-time">0.0 / 28.0</output>
</div>

<script>
/* Qorqbot launch motion, concept 05 "Independent by design" — authored choreography.
   Everything lives on one paused GSAP timeline, so seeking is deterministic. */
(() => {
  'use strict';

  /* ------------------------------------------------------------ constants */
  const ID = '05-kinetic-type';
  const W = 1920, H = 1080, DURATION = 28;
  const INK = '#1A1A1A', LINE = '#707477', NAME = '#F7F7F5';
  const BASE = 0.936;        // baseline depth (em) in a line-height:1 box: Zen Kaku Gothic New hhea 1160/288 on 1000 upm

  /* Layout, in stage pixels. */

  const S2 = {
    col: 250, textX: 330, size: 128, tracks: [330, 480, 630, 780],
    words: ['your favourite', 'models', 'working', 'together'],
    panel: { x: 1290, y: 190, w: 720, h: 620 }, listX: 1382, nameX: 1462, nameSize: 54,
    markX: 430, markH: 100, labelX: 360, arrowEnd: 506,
    head: { x: 140, baseline: 172, size: 120 }

  const S3 = {

    term: { w: 530, h: 295, reply: { x: 23, y: 218, w: 380, h: 61 } },
    chat: { w: 536, h: 248, top: 141, reply: 107, bubble: { x: 15, y: 5, w: 395, h: 90 } }
  };
  // Context icons ride one curve each: off-stage start -> resting place -> arrow tip.
  // `tip` is the arrowhead's bearing around the mascot (deg); it stops 70 px short of the body.
  const S4 = {
    size: 118, baseline: 236, horizon: 792, mascot: { x: 960, y: 640, d: 300 }, clearance: 70,
    icons: [
      { key: 'notion', size: 116, entry: [-100, 380, 90, 380, 240, 480, 330, 500], tip: 194 },

  const S5 = { size: 124, right: 1584, baselines: [312, 444], name: { size: 32, baseline: 520 }, ctaTop: 552, mascot: { x: 307.3, y: 767, d: 450.5 } };

  /* ------------------------------------------------------------ preview API */
  let deferred = null;
  const anim = window.__anim = {
    ready: false, duration: DURATION, errors: [],
    play() { deferred = { action: 'play' }; },
    pause() { deferred = { action: 'pause' }; },
    restart() { deferred = { action: 'restart' }; },
    seek(time) { deferred = { action: 'seek', time }; }
  };
  addEventListener('error', e => anim.errors.push(String(e.message || e)));
  addEventListener('unhandledrejection', e => anim.errors.push(String((e.reason && e.reason.message) || e.reason)));
  addEventListener('message', e => {
    if (window.parent === window || e.source !== window.parent) return;
    const d = e.data;
    if (!d || d.type !== 'qorqbot-animation') return;
    if (d.action === 'play') anim.play();
    else if (d.action === 'pause') anim.pause();
    else if (d.action === 'restart') anim.restart();
    else if (d.action === 'seek') anim.seek(d.time);
  });

  const params = new URLSearchParams(location.search);
  if (params.get('controls') === '0') document.body.classList.add('no-controls');

  const frame = document.getElementById('frame');
  const stage = document.getElementById('stage');
  function fit() {
    const fw = frame.clientWidth, fh = frame.clientHeight, s = Math.min(fw / W, fh / H);
    stage.style.transform = `translate(${(fw - W * s) / 2}px, ${(fh - H * s) / 2}px) scale(${s})`;
  }
  addEventListener('resize', fit);
  fit();

  /* ------------------------------------------------------------ helpers */
  const px = v => `${Math.round(v * 100) / 100}px`;
  const clamp01 = v => Math.max(0, Math.min(1, v));
  const SVGNS = 'http://www.w3.org/2000/svg';

  function div(parent, cls, css) {
    const n = document.createElement('div');
    if (cls) n.className = cls;
    if (css) Object.assign(n.style, css);
    parent.appendChild(n);
    return n;
  }
  function svg(parent, tag, attrs = {}) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    parent.appendChild(n);
    return n;
  }
  const layer = parent => svg(parent, 'svg', { class: 'layer', width: W, height: H, viewBox: `0 0 ${W} ${H}` });

  // Offsets of each segment within one typeset run (keeps natural spacing and kerning).
  function measure(segments, size, weight = 300, tracking = TRACK) {
    const probe = div(stage, 'type', { visibility: 'hidden', fontSize: px(size), fontWeight: weight, letterSpacing: `${tracking}em` });
    for (const s of segments) probe.appendChild(document.createElement('span')).textContent = s;
    const parts = [...probe.children].map(n => ({ x: n.offsetLeft, w: n.offsetWidth }));
    const width = probe.offsetWidth;
    probe.remove();
    return { parts, width, ink: width - tracking * size }; // trailing tracking is not ink
  }

  // A run of type inside a clipping mask. `wrap` sits on the run's left baseline,
  // so a transform with origin "0px 0px" scales the run about its baseline.
  function type(parent, text, o) {
    const size = o.size, tracking = o.tracking ?? TRACK, pad = Math.ceil(size * 0.14);
    const wrap = div(parent, 'wrap');
    const mask = div(wrap, 'mask', { left: px(-pad), top: px(-0.92 * size), height: px(1.24 * size) });
    const t = div(mask, 'type', {
      left: px(pad), top: px((0.92 - BASE) * size), fontSize: px(size),
      fontWeight: o.weight || 300, letterSpacing: `${tracking}em`, color: o.color || INK
    });
    t.textContent = text;
    const w = t.offsetWidth, ink = w - tracking * size;
    const x = o.align === 'right' ? o.x - ink : o.align === 'center' ? o.x - ink / 2 : o.x;
    mask.style.width = px(w + 2 * pad);
    Object.assign(wrap.style, { left: px(x), top: px(o.baseline) });
    return { wrap, mask, t, w, ink, size, x, baseline: o.baseline };
  }

  const MASCOT_SVG = '<svg viewBox="25.5 31.5 110 110" width="100%" height="100%" aria-hidden="true">'
    + '<path fill="#000" d="M31 86 C31 60 52 37 79 37 C106 36 129 59 130 86 C131 113 109 136 81 136 C54 137 31 115 31 86 Z"/>'
    + '<g class="gaze" fill="#fff"><g transform="rotate(-22 80 86)">'
    + '<g transform="translate(90 73) rotate(-12)"><path class="eye" d="M0 -12 C8 -7 8 7 0 12 C-8 7 -8 -7 0 -12 Z"/></g>'
    + '<g transform="translate(116.5 72) rotate(-12)"><path class="eye" d="M0 -10.5 C6 -6 6 6 0 10.5 C-6 6 -6 -6 0 -10.5 Z"/></g>'
    + '</g></g>'
    + '<g fill="#fff" transform="translate(5 0) rotate(-22 80 86)"><path transform="translate(91 103) scale(.65) translate(-91 -103)" d="M91 101 C86 96 82 97 75 101 C64 107 54 103 53 90 C46 108 58 120 73 115 C82 113 88 108 91 105 C95 108 101 113 109 114 C123 117 134 106 127 89 C126 102 117 106 107 101 C100 97 96 96 91 101 Z"/></g>'
    + '</svg>';

  // The approved black mascot, positioned by its centre; `body` is the face diameter in px.
  function mascot(parent, body) {
    const box = body * 110 / 99;
    const n = div(parent, 'mascot', { width: px(box), height: px(box), left: px(-box / 2), top: px(-box / 2) });
    n.innerHTML = MASCOT_SVG;
    return { n, gaze: n.querySelector('.gaze'), eyes: [...n.querySelectorAll('.eye')], body, box };
  }

  const FACE_PX = 110 / 86; // a face 86 traced units tall renders 110 px at scale 1
  function face(parent, f) {
    const box = 92 * FACE_PX;
    const n = div(parent, 'face', { width: px(box), height: px(box), left: px(-box / 2), top: px(-box / 2) });
    n.innerHTML = `<svg viewBox="-46 -46 92 92" width="100%" height="100%" aria-hidden="true"><path fill="${f.color}" d="${f.body}"/>`
      + f.features.map(d => `<path fill="#111" d="${d}"/>`).join('') + '</svg>';
    return { n, half: f.h / 2 * FACE_PX };
  }

  function mark(parent, m, height) {
    const box = 140 * height / 128;
    const n = div(parent, 'mark', { width: px(box), height: px(box), left: px(-box / 2), top: px(-box / 2) });
    n.innerHTML = `<svg viewBox="-70 -70 140 140" width="100%" height="100%" aria-hidden="true"><path fill="${m.color}" fill-rule="evenodd" d="${m.d}"/></svg>`;
    return n;
  }

  const cubic = a => `M${a[0]} ${a[1]} C${a[2]} ${a[3]} ${a[4]} ${a[5]} ${a[6]} ${a[7]}`;
  const endAngle = a => Math.atan2(a[7] - a[5], a[6] - a[4]) * 180 / Math.PI;
  // Slide 04's thin arrowhead: the tip sits 1 px past the line's end.
  function arrowhead(parent, x, y, angle) {
    return svg(parent, 'path', { d: 'M0 -5 L11 0 L0 5 Z', fill: LINE, transform: `translate(${x} ${y}) rotate(${angle}) translate(-10 0)` });
  }

  // Tween helpers: every tween is an explicit fromTo that renders only when reached.
  // GSAP rewinds such a tween to the values its target had when the tween first initialised,
  // so seed() gives every element its t = 0 state before the timeline is first rendered.
  const seeds = [];
  const ft = (tl, target, from, to, at) => {
    seeds.push({ target, from, at });
    return tl.fromTo(target, from, Object.assign({ immediateRender: false }, to), at);
  };
  function seed() {
    const seen = new Map();
    for (const { target, from } of seeds.slice().sort((a, b) => a.at - b.at)) {
      for (const el of gsap.utils.toArray(target)) {
        const done = seen.get(el) || seen.set(el, new Set()).get(el);
        const vars = {};
        for (const k in from) {
          if (k === 'attr') {
            for (const a in from.attr) {
              if (!done.has(`attr:${a}`)) { done.add(`attr:${a}`); (vars.attr = vars.attr || {})[a] = from.attr[a]; }
            }
          } else if (k !== 'transformOrigin' && !done.has(k)) { done.add(k); vars[k] = from[k]; }
        }
        if (Object.keys(vars).length) gsap.set(el, from.transformOrigin ? Object.assign(vars, { transformOrigin: from.transformOrigin }) : vars);
      }
    }
  }
  const rise = (tl, r, at, d = 0.9, ease = 'hero') => ft(tl, r.t, { y: 1.12 * r.size }, { y: 0, duration: d, ease }, at);
  const sink = (tl, r, at, d = 0.5) => ft(tl, r.t, { y: 0 }, { y: 1.12 * r.size, duration: d, ease: 'power3.in' }, at);
  const lift = (tl, r, at, d = 0.55) => ft(tl, r.t, { y: 0 }, { y: -1.28 * r.size, duration: d, ease: 'power3.in' }, at);
  // a proxy tween; hand-placed elements are redrawn from proxies after every timeline render (see start)
  const drive = (tl, proxy, key, from, to, at, duration, ease) =>
    tl.fromTo(proxy, { [key]: from }, { [key]: to, duration, ease, immediateRender: false }, at);
  function blink(tl, m, at) {
    ft(tl, m.eyes, { scaleY: 1, transformOrigin: '50% 50%' }, { scaleY: 0.08, transformOrigin: '50% 50%', duration: 0.07, ease: 'power2.in' }, at);
    ft(tl, m.eyes, { scaleY: 0.08, transformOrigin: '50% 50%' }, { scaleY: 1, transformOrigin: '50% 50%', duration: 0.13, ease: 'power2.out' }, at + 0.07);
  }

  /* ------------------------------------------------------------ cast */
  function build() {
    const c = {};
    const sampler = layer(stage);
    sampler.style.visibility = 'hidden';
    const route = d => {
      const p = svg(sampler, 'path', { d });
      const len = p.getTotalLength();
      return { len, at: s => p.getPointAtLength(Math.max(0, Math.min(len, s))) };
    };
    const straight = y => `M1880 ${y} C1267 ${y} 653 ${y} 40 ${y}`;
    const insetX = (l, r) => `inset(0px ${W - r}px 0px ${l}px)`;

    /* Scenes 1–2 share one cast: type lines, faces, agent list and provider marks. */
    const cast = c.cast = div(stage, 'scene');
    const lines = layer(cast);

    // Scene 1 geometry: one typeset line, then the same words stepped apart.
    const { F0, F1, B, gap } = S1, s = c.s = F1 / F0;
    const run = measure(['get', ' ', 'stuff', ' ', 'done'], F0);
    const w0 = [0, 2, 4].map(i => run.parts[i].w);
    c.x0 = [0, 2, 4].map(i => W / 2 - run.ink / 2 + run.parts[i].x);
    const total = s * (w0[0] + w0[1] + w0[2]) + 2 * gap;
    c.x1 = [W / 2 - total / 2];
    c.x1[1] = c.x1[0] + s * w0[0] + gap;
    c.x1[2] = c.x1[1] + s * w0[1] + gap;
    const gap0 = [0, 1].map(i => [c.x0[i] + w0[i], c.x0[i + 1]]);
    const gap1 = [0, 1].map(i => [c.x1[i] + s * w0[i], c.x1[i + 1]]);
    // the four type lines of the stepped-down words: ascender, x-height, baseline, descender
    const sit = [B - 0.727 * F1, B - 0.478 * F1, B, B + 0.224 * F1];

    c.guideD = sit.map(straight);
    c.trackD = S2.tracks.map(straight);
    c.guides = sit.map((y, i) => svg(lines, 'path', {
      d: c.guideD[i], fill: 'none', stroke: LINE, 'stroke-width': 1.2, 'stroke-opacity': 0.35,
      'stroke-linecap': 'round', 'stroke-dasharray': '4000 4000'
    }));

    // the zoomed agent list
    const P = S2.panel;
    c.panel = div(cast, 'panel', { left: px(P.x), top: px(P.y), width: px(P.w), height: px(P.h) });

    // faces: revealed between the word blocks, each sitting on a different type line
    const keys = ['mike', 'turgut', 'adam', 'borte'];
    c.gaps = [0, 1].map(i => {
      const mid = (gap0[i][0] + gap0[i][1]) / 2;
      return { n: div(cast, 'scene'), closed: insetX(mid, mid), open: insetX(gap1[i][0], gap1[i][1]) };
    });
    const r = S1.face / 2, inset = (gap - 2 * S1.face - 36) / 2;
    const fx = [gap1[0][0] + inset + r, gap1[0][1] - inset - r, gap1[1][0] + inset + r, gap1[1][1] - inset - r];
    c.faceScale = S1.face / 110;
    c.faces = keys.map((k, i) => {
      const f = face(c.gaps[i < 2 ? 0 : 1].n, ASSETS.faces[k]);
      f.p1 = { x: fx[i], y: sit[i] - f.half * c.faceScale };
      gsap.set(f.n, { x: f.p1.x, y: f.p1.y, scale: c.faceScale });
      return f;
    });
    // rows of the list: each face sits on its track; names share the face's optical centre
    const rows = c.faces.map((f, i) => S2.tracks[i] - f.half);
    c.names = ['Mike', 'Turgut', 'Adam', 'Borte'].map((n, i) =>
      type(cast, n, { size: S2.nameSize, weight: 500, tracking: -0.01, color: NAME, x: S2.nameX, baseline: rows[i] + 0.35 * S2.nameSize }));
    c.panel.after(...c.names.map(n => n.wrap)); // names sit on the panel, under the travelling faces

    // provider marks take the faces' starting column; the tracks become arrows to them
    const markY = [(rows[0] + rows[1]) / 2, rows[2], rows[3]];
    c.marks = ['codex', 'claude', 'deepseek'].map((k, i) => {
      const n = mark(cast, ASSETS.marks[k], S2.markH);
      gsap.set(n, { x: S2.markX, y: markY[i] });
      return n;
    });
    c.labels = ['Codex', 'Claude', 'DeepSeek'].map((t, i) => type(cast, t, { size: 30, weight: 500, tracking: 0, x: S2.labelX, baseline: markY[i] + 10, align: 'right' }));
    const ends = [markY[0] - 17, markY[0] + 17, markY[1], markY[2]];
    const arrows = rows.map((y, i) => [P.x, y, 1010, y, 760, ends[i], S2.arrowEnd, ends[i]]);
    c.arrowD = arrows.map(cubic);
    c.heads = arrows.map(a => arrowhead(lines, a[6], a[7], endAngle(a)));

    // scene 1 words; the mascot peeks over "done" from behind its x-height
    c.words = ['get', 'stuff', 'done'].map((t, i) => type(cast, t, { size: F0, x: c.x0[i], baseline: B }));
    const done = c.words[2], box = S1.mascot * 110 / 99;
    const xh = -0.478 * F0 + 3;                     // just under the x-height, relative to the baseline
    c.peek = div(done.wrap, 'peek', { left: px(0.72 * done.w - box / 2 - 10), top: px(xh - box - 20), width: px(box + 20), height: px(box + 20) });
    c.pm = mascot(c.peek, S1.mascot);
    c.peekShow = box + 20 + 0.07 * S1.mascot;      // eyes clear the letters, the mustache stays behind them
    c.peekHide = box + 20 + 0.62 * S1.mascot;
    gsap.set(c.pm.n, { x: box / 2 + 10, y: c.peekHide });

    // scene 2 statements, one per track
    c.lines = S2.words.map((t, i) => type(cast, t, { size: S2.size, x: S2.textX, baseline: S2.tracks[i] }));

    // "any cli, any provider", revealed by an ink bar
    const hd = S2.head;
    c.head = type(cast, 'any cli, any provider', { size: hd.size, x: hd.x, baseline: hd.baseline });
    c.bar = div(cast, 'bar', { left: px(hd.x - 12), top: px(hd.baseline - 0.8 * hd.size), width: px(c.head.ink + 24), height: px(1.08 * hd.size) });

    /* Scene 3: the subscription sentence over two approved UI slices. */
    const s3 = c.s3 = div(stage, 'scene');
    const s3lines = layer(s3);
    const T = S3.term, Ch = S3.chat;
    const termLeft = (W - (T.w + S3.gapX + Ch.w)) / 2, chatLeft = termLeft + T.w + S3.gapX;
    c.termWrap = div(s3, 'ui', { left: px(termLeft), top: px(S3.top), width: px(T.w), height: px(T.h) });
    c.termShadow = div(c.termWrap, 'ui-shadow');
    c.termPanel = div(c.termWrap, 'ui-panel', { backgroundImage: `url("${ASSETS.img.terminal}")` });
    c.termShift = W / 2 - T.w / 2 - termLeft;
    c.chatWrap = div(s3, 'ui', { left: px(chatLeft), top: px(S3.top), width: px(Ch.w), height: px(Ch.h) });
    c.chatShadow = div(c.chatWrap, 'ui-shadow');
    c.chatPanel = div(c.chatWrap, 'ui-panel', { background: '#10100F' });
    div(c.chatPanel, 'crop', { left: '0px', top: '0px', width: px(Ch.w), height: px(Ch.top), backgroundImage: `url("${ASSETS.img.chatTop}")` });
    c.chatReply = div(c.chatPanel, 'crop', { left: '0px', top: px(Ch.top), width: px(Ch.w), height: px(Ch.reply), backgroundImage: `url("${ASSETS.img.chatReply}")` });
    c.chatR = Math.ceil(Math.hypot(Ch.w, Ch.h / 2)) + 6;

    const run3 = measure(['use ', 'your subscription', ', not API pricing'], S3.size);
    const left3 = W / 2 - run3.ink / 2;
    c.use = type(s3, 'use', { size: S3.size, x: left3 + run3.parts[0].x, baseline: S3.baseline });
    c.rest = type(s3, ', not API pricing', { size: S3.size, x: left3 + run3.parts[2].x, baseline: S3.baseline });
    // set at the huge size and scaled down into the sentence, so the big type stays crisp
    c.mid = type(s3, 'your subscription', { size: S3.huge, x: left3 + run3.parts[1].x, baseline: S3.baseline });
    c.midScale = S3.size / S3.huge;
    c.midHuge = { x: W / 2 - c.mid.ink / 2 - c.mid.x, y: S3.hugeBaseline - S3.baseline };
    gsap.set(c.mid.wrap, { x: c.midHuge.x, y: c.midHuge.y, scale: 1, transformOrigin: '0px 0px' });

    const tr = T.reply, cb = Ch.bubble;
    // while the message travels, its source line in the terminal steps back
    c.termDim = div(c.termPanel, 'crop', { left: px(tr.x - 6), top: px(tr.y - 4), width: px(tr.w + 12), height: px(tr.h + 8), background: '#00252F' });
    const from = { x: termLeft + tr.x + tr.w / 2, y: S3.top + tr.y + tr.h / 2 };
    const to = { x: chatLeft + cb.x + cb.w / 2, y: S3.top + Ch.top + cb.y + cb.h / 2 };
    const a = [termLeft + T.w + 16, from.y, termLeft + T.w + 126, from.y, chatLeft - 126, to.y, chatLeft - 16, to.y];
    c.connector = svg(s3lines, 'path', { d: cubic(a), fill: 'none', stroke: LINE, 'stroke-width': 1.7, 'stroke-linecap': 'round' });
    c.connLen = c.connector.getTotalLength();
    c.connector.setAttribute('stroke-dasharray', `${c.connLen} ${c.connLen}`);
    c.connHead = arrowhead(s3lines, a[6], a[7], endAngle(a));
    const flight = route(`M${from.x} ${from.y} L${a[0]} ${a[1]} C${a[2]} ${a[3]} ${a[4]} ${a[5]} ${a[6]} ${a[7]} L${to.x} ${to.y}`);
    c.block = div(s3, 'block');
    c.skinTerm = div(c.block, 'skin lifted', {
      left: px(-tr.w / 2), top: px(-tr.h / 2), width: px(tr.w), height: px(tr.h),
      backgroundImage: `url("${ASSETS.img.terminal}")`, backgroundSize: `${T.w}px ${T.h}px`, backgroundPosition: `${-tr.x}px ${-tr.y}px`
    });
    // mid-flight the chat rendering of the same message wipes over the terminal one
    c.chatLift = div(c.block, 'lifted', { position: 'absolute', left: px(-cb.w / 2), top: px(-cb.h / 2), width: px(cb.w), height: px(cb.h), borderRadius: '12px' });
    c.chatWipe = { from: `inset(0px ${cb.w}px 0px 0px round 12px)`, to: 'inset(0px 0px 0px 0px round 12px)' };
    c.skinChat = div(c.block, 'skin', {
      left: px(-cb.w / 2), top: px(-cb.h / 2), width: px(cb.w), height: px(cb.h), borderRadius: '12px',
      backgroundImage: `url("${ASSETS.img.chatReply}")`, backgroundSize: `${Ch.w}px ${Ch.reply}px`, backgroundPosition: `${-cb.x}px ${-cb.y}px`
    });
    c.flight = { p: 0 };
    c.placeBlock = () => {
      const p = c.flight.p, pt = flight.at(p * flight.len);
      c.block.style.transform = `translate(${px(pt.x)}, ${px(pt.y)}) scale(${1 + 0.04 * Math.sin(Math.PI * p)})`;
    };
    c.placeBlock();

    /* Scenes 4–5: context icons, the mascot and the landing endcard. */
    const s4 = c.s4 = div(stage, 'scene');
    const s4lines = layer(s4);
    const M4 = S4.mascot, reach = M4.d / 2 + S4.clearance;
    c.icons = S4.icons.map(o => {
      const e = o.entry, rest = { x: e[6], y: e[7] };
      const th = o.tip * Math.PI / 180, tip = { x: M4.x + reach * Math.cos(th), y: M4.y + reach * Math.sin(th) };
      const span = Math.hypot(tip.x - rest.x, tip.y - rest.y);
      const out = { x: rest.x - e[4], y: rest.y - e[5] }, outLen = Math.hypot(out.x, out.y);
      // leave the resting place along the entry's own tangent, arrive pointing at the mascot's centre
      const arrow = [rest.x, rest.y, rest.x + out.x / outLen * 0.4 * span, rest.y + out.y / outLen * 0.4 * span,
        tip.x + Math.cos(th) * 0.35 * span, tip.y + Math.sin(th) * 0.35 * span, tip.x, tip.y];
      const curve = `${cubic(e)} C${arrow.slice(2).join(' ')}`;
      const path = route(`${curve} L${M4.x} ${M4.y}`);
      const ic = { o, pos: { s: 0 }, draw: { p: 0 } };
      ic.rest = route(cubic(e)).len;                 // arc length of the resting place
      ic.tipAt = ic.rest + route(cubic(arrow)).len;   // arc length of the arrow tip
      ic.end = path.len;                              // arc length of the mascot's centre
      ic.line = svg(s4lines, 'path', { d: curve, fill: 'none', stroke: LINE, 'stroke-width': 1.7, 'stroke-linecap': 'round', 'stroke-dasharray': `0 ${ic.end + 100}` });
      ic.head = arrowhead(s4lines, tip.x, tip.y, endAngle(arrow));
      ic.n = document.createElement('img');
      ic.n.className = 'icon';
      ic.n.alt = '';
      ic.n.src = ASSETS.img[o.key];
      Object.assign(ic.n.style, { width: px(o.size), height: px(o.size), left: px(-o.size / 2), top: px(-o.size / 2) });
      s4.appendChild(ic.n);
      const lead = o.size / 2 + 28;                   // the line starts this far ahead of the icon's centre
      // one renderer for both proxies: icon position along the curve, and how far the line has drawn
      ic.render = () => {
        const sNow = ic.pos.s, pt = path.at(sNow), past = clamp01((sNow - ic.tipAt) / (ic.end - ic.tipAt));
        ic.n.style.transform = `translate(${px(pt.x)}, ${px(pt.y)}) scale(${1 - 0.6 * past})`;
        ic.n.style.opacity = String(clamp01(1 - 1.4 * past));
        const a0 = sNow + lead, a1 = ic.draw.p * ic.tipAt;
        ic.line.setAttribute('stroke-dasharray', a1 > a0 ? `${a1 - a0} ${ic.end + 100}` : `0 ${ic.end + 100}`);
        ic.line.setAttribute('stroke-dashoffset', String(-Math.min(a0, ic.tipAt)));
        ic.head.style.opacity = String(clamp01((a1 - ic.tipAt + 24) / 24) * clamp01((ic.tipAt - 8 - a0) / 16));
      };
      ic.render();
      return ic;
    });
    c.mclip = div(s4, 'scene', { clipPath: `inset(0px 0px ${H - S4.horizon}px 0px)` });
    c.hero = mascot(c.mclip, S5.mascot.d);
    c.heroScale4 = M4.d / S5.mascot.d;
    c.heroHidden = S4.horizon + M4.d / 2 + 8;
    gsap.set(c.hero.n, { x: M4.x, y: c.heroHidden, scale: c.heroScale4 });

    const run4 = measure(['your context stays ', 'local'], S4.size);
    const left4 = W / 2 - run4.ink / 2;
    c.ctx = type(s4, 'your context stays', { size: S4.size, x: left4, baseline: S4.baseline });
    c.local = type(s4, 'local', { size: S4.size, x: left4 + run4.parts[1].x, baseline: S4.baseline });
    c.rule = div(s4, 'rule', { left: px(c.local.x), top: px(S4.baseline + 18), width: px(c.local.ink) });

    c.end1 = type(s4, 'get stuff done', { size: S5.size, x: S5.right, baseline: S5.baselines[0], align: 'right' });
    c.end2 = type(s4, 'stay independent', { size: S5.size, x: S5.right, baseline: S5.baselines[1], align: 'right' });
    c.name = type(s4, 'qorqbot', { size: S5.name.size, weight: 400, tracking: 0, color: 'rgba(26,26,26,0.8)', x: S5.right, baseline: S5.name.baseline, align: 'right' });
    c.cta = div(s4, 'cta', { right: px(W - S5.right), top: px(S5.ctaTop) });
    c.cta.textContent = 'See on Github';
    c.redraw = () => { c.placeBlock(); c.icons.forEach(ic => ic.render()); };
    return c;
  }

  /* ------------------------------------------------------------ choreography */

  // 0–5  "get stuff done" typesets; the mascot peeks; the words step apart to reveal the agents.
  function scene1(tl, c) {
    const [get, stuff, done] = c.words;
    rise(tl, get, 0.3, 0.95);
    rise(tl, stuff, 0.4, 0.95);
    rise(tl, done, 1.15, 0.95);
    ft(tl, c.pm.n, { y: c.peekHide }, { y: c.peekShow, duration: 0.8, ease: 'hero' }, 2.05);
    ft(tl, c.pm.gaze, { x: 0, y: 0 }, { x: -3.6, y: 0.5, duration: 0.45, ease: 'power2.out' }, 2.6);  // a sideways glance along the word
    blink(tl, c.pm, 3.05);
    c.words.forEach((w, i) => ft(tl, w.wrap,
      { x: 0, scale: 1, transformOrigin: '0px 0px' },
      { x: c.x1[i] - c.x0[i], scale: c.s, transformOrigin: '0px 0px', duration: 1.0, ease: 'power3.inOut' }, 3.3));
    c.gaps.forEach(g => ft(tl, g.n, { clipPath: g.closed }, { clipPath: g.open, duration: 1.0, ease: 'power3.inOut' }, 3.3));
    c.guides.forEach((p, i) => ft(tl, p, { attr: { 'stroke-dashoffset': -1840 } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.85, ease: 'power2.out' }, 3.85 + i * 0.06));
  }

  // 5–11  the statements become tracks; the faces ride them into the agent list; providers connect.
  function scene2(tl, c) {
    c.words.forEach((w, i) => sink(tl, w, 4.95 + i * 0.05));
    ft(tl, c.pm.n, { y: c.peekShow }, { y: c.peekHide, duration: 0.45, ease: 'power2.in' }, 5.03);
    c.gaps.forEach(g => ft(tl, g.n, { clipPath: g.open }, { clipPath: 'inset(0px 0px 0px 0px)', duration: 0.01 }, 5.15));
    const spread = { duration: 0.8, ease: 'power3.inOut' };
    c.guides.forEach((p, i) => ft(tl, p,
      { attr: { d: c.guideD[i], 'stroke-opacity': 0.35, 'stroke-width': 1.2 } },
      Object.assign({ attr: { d: c.trackD[i], 'stroke-opacity': 0.8, 'stroke-width': 1.5 } }, spread), 5.15));
    c.faces.forEach((f, i) => ft(tl, f.n, { x: f.p1.x, y: f.p1.y },
      Object.assign({ x: S2.col, y: S2.tracks[i] - f.half * c.faceScale }, spread), 5.15 + i * 0.03));

    // "your favourite models", then "working together"; each statement then flattens into its track
    const enter = [5.55, 5.62, 6.3, 6.37], fold = 7.6, travel = [7.75, 7.85, 7.95, 8.05];
    c.lines.forEach((r, i) => {
      rise(tl, r, enter[i], 0.85);
      ft(tl, r.t, { scaleY: 1, opacity: 1, transformOrigin: `0px ${BASE * r.size}px` },
        { scaleY: 0, opacity: 0, transformOrigin: `0px ${BASE * r.size}px`, duration: 0.42, ease: 'power2.in' }, fold + i * 0.06);
    });
    ft(tl, c.panel, { x: 760 }, { x: 0, duration: 0.75, ease: 'hero' }, 7.7);
    c.faces.forEach((f, i) => {
      ft(tl, f.n, { x: S2.col, y: S2.tracks[i] - f.half * c.faceScale, scale: c.faceScale },
        { x: S2.listX, y: S2.tracks[i] - f.half, scale: 1, duration: 0.95, ease: 'power3.inOut' }, travel[i]);
      rise(tl, c.names[i], travel[i] + 0.75, 0.6);
    });

    c.guides.forEach((p, i) => ft(tl, p,
      { attr: { d: c.trackD[i], 'stroke-opacity': 0.8, 'stroke-width': 1.5 } },
      { attr: { d: c.arrowD[i], 'stroke-opacity': 1, 'stroke-width': 1.7 }, duration: 0.8, ease: 'power3.inOut' }, 8.95 + i * 0.06));
    // marks and labels arrive once the retreating track ends have passed them
    c.marks.forEach((n, i) => ft(tl, n, { autoAlpha: 0, scale: 0.86 }, { autoAlpha: 1, scale: 1, duration: 0.6, ease: 'hero' }, 9.3 + i * 0.08));
    c.labels.forEach((r, i) => rise(tl, r, 9.5 + i * 0.08, 0.55));
    c.heads.forEach((h, i) => ft(tl, h, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'none' }, 9.68 + i * 0.06));

    ft(tl, c.bar, { scaleX: 0, transformOrigin: '0% 50%' }, { scaleX: 1, transformOrigin: '0% 50%', duration: 0.36, ease: 'power3.inOut' }, 9.65);
    ft(tl, c.head.t, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01 }, 10.01);
    ft(tl, c.bar, { scaleX: 1, transformOrigin: '100% 50%' }, { scaleX: 0, transformOrigin: '100% 50%', duration: 0.42, ease: 'power3.inOut' }, 10.02);
  }

  // 11–17  huge "your subscription" over the terminal slice, the chat slice opens, one message streams across.
  function scene3(tl, c) {
    ft(tl, c.cast, { clipPath: 'inset(0px 0px 0px 0px)' }, { clipPath: `inset(0px ${W}px 0px 0px)`, duration: 0.65, ease: 'power3.inOut' }, 10.95);
    rise(tl, c.mid, 11.25, 1.0);
    ft(tl, c.termPanel, { clipPath: `inset(0px 0px ${S3.term.h}px 0px round 14px)` }, { clipPath: 'inset(0px 0px 0px 0px round 14px)', duration: 0.75, ease: 'power3.out' }, 12.05);
    ft(tl, c.termWrap, { y: 26 }, { y: 0, duration: 0.75, ease: 'hero' }, 12.05);
    ft(tl, c.termShadow, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'none' }, 12.55);
    ft(tl, c.termWrap, { x: c.termShift }, { x: 0, duration: 0.8, ease: 'power3.inOut' }, 12.85);
    const cy = S3.chat.h / 2;
    ft(tl, c.chatPanel, { clipPath: `circle(0px at 0px ${cy}px)` }, { clipPath: `circle(${c.chatR}px at 0px ${cy}px)`, duration: 0.85, ease: 'power2.inOut' }, 13.1);
    ft(tl, c.chatShadow, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'none' }, 13.75);
    ft(tl, c.mid.wrap, { x: c.midHuge.x, y: c.midHuge.y, scale: 1, transformOrigin: '0px 0px' },
      { x: 0, y: 0, scale: c.midScale, transformOrigin: '0px 0px', duration: 0.9, ease: 'power3.inOut' }, 13.65);
    rise(tl, c.use, 14.05, 0.7);
    rise(tl, c.rest, 14.15, 0.7);
    ft(tl, c.connector, { attr: { 'stroke-dashoffset': c.connLen } }, { attr: { 'stroke-dashoffset': 0 }, duration: 0.5, ease: 'power2.out' }, 14.75);
    ft(tl, c.connHead, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'none' }, 15.15);
    ft(tl, c.block, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: 'none' }, 14.95);
    ft(tl, c.termDim, { opacity: 0 }, { opacity: 0.72, duration: 0.25, ease: 'power1.out' }, 15.05);
    drive(tl, c.flight, 'p', 0, 1, 15.1, 1.0, 'power2.inOut');
    ft(tl, c.skinChat, { clipPath: c.chatWipe.from }, { clipPath: c.chatWipe.to, duration: 0.3, ease: 'power2.inOut' }, 15.42);
    ft(tl, c.chatLift, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'none' }, 15.42);
    ft(tl, c.skinTerm, { opacity: 1 }, { opacity: 0, duration: 0.01 }, 15.72);
    ft(tl, c.chatReply, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'none' }, 16.05);
    ft(tl, c.block, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: 'none' }, 16.15);
    ft(tl, c.termDim, { opacity: 0.72 }, { opacity: 0, duration: 0.35, ease: 'power1.inOut' }, 16.25);
  }

  // 17–22  "your context stays local"; the original icons arrive from three directions.
  function scene4(tl, c) {
    ft(tl, c.s3, { clipPath: 'inset(0px 0px 0px 0px)' }, { clipPath: `inset(${H}px 0px 0px 0px)`, duration: 0.6, ease: 'power3.inOut' }, 16.95);
    rise(tl, c.ctx, 17.3, 0.9);
    // the final word drops in with its mask and settles onto the shared baseline
    ft(tl, c.local.wrap, { y: -0.32 * S4.size, opacity: 0 }, { y: 0, opacity: 1, duration: 1.05, ease: 'hero' }, 17.85);
    ft(tl, c.rule, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: 'power2.out' }, 18.45);
    ft(tl, c.rule, { opacity: 0.4 }, { opacity: 0, duration: 0.5, ease: 'none' }, 19.15);
    ft(tl, c.hero.n, { y: c.heroHidden }, { y: S4.mascot.y, duration: 0.9, ease: 'hero' }, 18.35);
    ft(tl, c.mclip, { clipPath: `inset(0px 0px ${H - S4.horizon}px 0px)` }, { clipPath: 'inset(0px 0px 0px 0px)', duration: 0.01 }, 19.3);
    c.icons.forEach((ic, i) => {
      const t = 18.95 + i * 0.3;
      drive(tl, ic.draw, 'p', 0, 1, t, 0.9, 'power2.out');
      drive(tl, ic.pos, 's', 0, ic.rest, t + 0.1, 1.0, 'power3.out');
    });
    blink(tl, c.hero, 20.95);
  }

  // 22–28  everything eases into the mascot, which settles left of the landing endcard. Hold 2.2 s.
  function scene5(tl, c) {
    c.icons.forEach((ic, i) => drive(tl, ic.pos, 's', ic.rest, ic.end, 22.0 + i * 0.1, 0.9, 'power3.inOut'));
    lift(tl, c.ctx, 22.2);
    lift(tl, c.local, 22.25);
    ft(tl, c.hero.n, { x: S4.mascot.x, y: S4.mascot.y, scale: c.heroScale4 },
      { x: S5.mascot.x, y: S5.mascot.y, scale: 1, duration: 1.1, ease: 'release' }, 22.85);
    ft(tl, c.hero.n, { filter: SHADOW_OFF }, { filter: SHADOW_ON, duration: 0.8, ease: 'power2.out' }, 23.35);
    rise(tl, c.end1, 23.3, 0.9);
    rise(tl, c.end2, 23.75, 0.9);
    rise(tl, c.name, 24.5, 0.7);
    ft(tl, c.cta, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 24.85);
    ft(tl, c.hero.gaze, { x: 0, y: 0 }, { x: 2.2, y: -1.4, duration: 0.4, ease: 'power2.out' }, 25.3);
    blink(tl, c.hero, 25.55); // the last motion ends at 25.75; the endcard then holds to 28.0
  }

  /* ------------------------------------------------------------ boot */
  function start(tl, c) {
    const clampTime = t => Math.min(DURATION, Math.max(0, Number.isFinite(+t) ? +t : 0));
    const btn = document.getElementById('c-play');
    const seekbar = document.getElementById('c-seek');
    const readout = document.getElementById('c-time');
    const sync = () => {
      const t = tl.time(), playing = !tl.paused() && t < DURATION;
      seekbar.value = t.toFixed(2);
      readout.textContent = `${t.toFixed(1)} / ${DURATION.toFixed(1)}`;
      btn.classList.toggle('is-playing', playing);
      btn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    };
    // proxies (message block, context icons) are drawn from their current values after every render,
    // so a seek in any direction leaves them exactly where a straight play would
    tl.eventCallback('onUpdate', () => { c.redraw(); sync(); });
    tl.eventCallback('onComplete', () => { tl.pause(); sync(); });

    anim.play = () => { if (tl.time() >= DURATION - 1e-3) tl.play(0); else tl.play(); sync(); };
    anim.pause = () => { tl.pause(); sync(); };
    anim.restart = () => { tl.restart(); sync(); };
    anim.seek = t => { tl.pause(); tl.time(clampTime(t)); sync(); };

    btn.addEventListener('click', () => (btn.classList.contains('is-playing') ? anim.pause() : anim.play()));
    document.getElementById('c-restart').addEventListener('click', () => anim.restart());
    seekbar.addEventListener('input', () => anim.seek(parseFloat(seekbar.value)));
    addEventListener('keydown', e => {
      if (e.code === 'Space' && (e.target === document.body || e.target === seekbar)) { e.preventDefault(); btn.click(); }
    });

    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (params.has('t')) anim.seek(params.get('t'));
    else if (params.has('paused') && params.get('paused') !== '0') anim.seek(0);
    else if (reduced) anim.seek(REDUCED_FRAME);
    else anim.play();

    stage.style.visibility = 'visible';
    anim.ready = true;
    const queued = deferred;
    deferred = null;
    if (queued) queued.action === 'seek' ? anim.seek(queued.time) : anim[queued.action]();
    if (window.parent !== window) window.parent.postMessage({ type: 'qorqbot-animation-ready', id: ID, duration: DURATION }, '*');
  }

  function boot() {
    try {
      gsap.registerPlugin(CustomEase);
      gsap.defaults({ lazy: false, overwrite: false });
      gsap.config({ force3D: false });
      CustomEase.create('hero', '0.22,1,0.36,1');     // the 49IDE film's heavy settle
      CustomEase.create('release', '0.45,0,0.15,1');  // and its unhurried release
      if (!document.fonts.check('300 100px "Zen Kaku Gothic New"')) anim.errors.push('Zen Kaku Gothic New was not ready; layout used a fallback');
      const c = build();
      const tl = gsap.timeline({ paused: true });
      scene1(tl, c);
      scene2(tl, c);
      scene3(tl, c);
      scene4(tl, c);
      scene5(tl, c);
      tl.set({}, {}, DURATION);
      if (Math.abs(tl.duration() - DURATION) > 1e-6) anim.errors.push(`timeline duration ${tl.duration()} != ${DURATION}`);
      seed();
      // initialise every tween once, in order, then rewind to the seeded t = 0 state
      tl.progress(1, true).progress(0, true);
      c.redraw();
      start(tl, c);
    } catch (e) {
      anim.errors.push(String((e && e.stack) || e));
      stage.style.visibility = 'visible';
    }
  }

  const fonts = Promise.all([300, 400, 500].map(w => document.fonts.load(`${w} 100px "Zen Kaku Gothic New"`)))
    .then(() => document.fonts.ready)
    .catch(e => anim.errors.push(`font load: ${e}`));
  Promise.race([fonts, new Promise(r => setTimeout(r, 4000))]).then(boot);
})();
</script>
</body>
</html>
