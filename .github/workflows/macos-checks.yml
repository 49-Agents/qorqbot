name: Native Mac preparation checks
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional SemVer for a downloadable DMG candidate (for example 1.3.0-preview.2)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 75
    outputs:
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/*constraints.txt
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/qorqbot/wheels
          key: ${{ runner.os }}-${{ runner.arch }}-qorqbot-wheels-v1-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-qorqbot-wheels-v1-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install desktop build dependencies and select version
        id: select
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm ci --prefix qorqut-code/tools/distribution/macos_app/electron
          node <<'JS'
          const fs = require('node:fs');
          const semver = require('./qorqut-code/tools/distribution/macos_app/electron/node_modules/semver');
          const version = process.env.RELEASE_VERSION || require('node:child_process').execFileSync('python3', ['qorqut-code/tools/distribution/build_version.py', '1.3.0', 'mac-check', '--commit', process.env.GITHUB_SHA], {encoding: 'utf8'}).trim();
          if (semver.valid(version) !== version) throw new Error('Version must be canonical SemVer');
          fs.appendFileSync(process.env.GITHUB_ENV, `QORQBOT_BUILD_VERSION=${version}\nRELEASE_WORK=${process.env.RUNNER_TEMP}/qorqbot-mac\nMAC_EVIDENCE=${process.env.RUNNER_TEMP}/mac-evidence\nAGENT_CLI_ROOT=${process.env.RUNNER_TEMP}/agent-cli-root\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - name: Check native target and install build prerequisites
        run: |
          test "$(uname -m)" = arm64
          brew install tmux librsvg
          python -m pip install packaging
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/qorqbot/mac-tools
          key: ${{ runner.os }}-${{ runner.arch }}-qorqbot-mac-tools-v1-${{ hashFiles('qorqut-code/tools/distribution/macos_tools.py') }}
      - name: Build the programs the package ships (Python, tmux, git)
        run: |
          tools="$HOME/.cache/qorqbot/mac-tools"
          if [ ! -f "$tools/out/TOOLS.json" ]; then
            rm -rf "$tools"
            mkdir -p "$tools"
            python qorqut-code/tools/distribution/macos_tools.py --output "$tools/out" --work "$RUNNER_TEMP/mac-tools-work"
          fi
          cat "$tools/out/TOOLS.json"
      - name: Export and build this exact commit
        run: |
          mkdir -p "$RELEASE_WORK"
          python qorqut-code/tools/export-unified.py --repository "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" --with-fastmail --output "$RELEASE_WORK/source"
          python qorqut-code/tools/distribution/runtime_source.py project --source "$RELEASE_WORK/source" --output "$RELEASE_WORK/runtime-source" --report "$RELEASE_WORK/projection.json"
          python qorqut-code/tools/prepare-local.py --source-root "$RELEASE_WORK/runtime-source" --output "$RELEASE_WORK/prepared" --with-google-calendar --with-treg
          python qorqut-code/tools/distribution/native_build.py --prepared "$RELEASE_WORK/prepared" --target macos14-arm64 --bundled-tools "$HOME/.cache/qorqbot/mac-tools/out" --output "$RELEASE_WORK/package" --report "$RELEASE_WORK/build.json" --version "$QORQBOT_BUILD_VERSION"
      - name: Check exact Mac archive lifecycle
        run: |
          python qorqut-code/tools/distribution/check_posix.py --archive "$RELEASE_WORK/package/qorqbot-${QORQBOT_BUILD_VERSION}-macos14-arm64.tar.gz" --output "/tmp/qm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      # The steps below that carry `continue-on-error` always let the later steps run, so the disk image, the first-open check and
      # the evidence are produced even when a test fails; the last step of the job fails it when any of them failed.
      - name: Tests of the managed-agent work, one module at a time
        id: new_tests
        if: always()
        continue-on-error: true
        timeout-minutes: 30
        run: |
          test_python="/tmp/qm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/i/qorqbot/runtime/venv/bin/python"
          mkdir -p "$MAC_EVIDENCE"
          python -B qorqut-code/tools/distribution/macos_app/mac_new_tests.py --python "$test_python" --repository "$GITHUB_WORKSPACE" --output "$MAC_EVIDENCE/new-tests"
      - name: Run Mac runtime and launcher tests
        id: suite
        continue-on-error: true
        timeout-minutes: 30
        env:
          # The managed host tests start real host processes that import the tests' own fake driver: the host takes its
          # import path from this variable (-I below makes the test process itself ignore it).
          PYTHONPATH: ${{ github.workspace }}/qorqut-code/app/tests
        run: |
          test_python="/tmp/qm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/i/qorqbot/runtime/venv/bin/python"
          mkdir -p "$MAC_EVIDENCE/suite"
          status=0
          "$test_python" -I -B -m unittest discover -s qorqut-code/app/tests >"$MAC_EVIDENCE/suite/app-tests.log" 2>&1 || status=1
          tail -n 80 "$MAC_EVIDENCE/suite/app-tests.log"
          "$test_python" -I -B -m unittest discover -s qorqut-code/tools/distribution/tests >"$MAC_EVIDENCE/suite/distribution-tests.log" 2>&1 || status=1
          tail -n 30 "$MAC_EVIDENCE/suite/distribution-tests.log"
          exit $status
      - name: Real Claude Code and Codex download on this Mac (no account)
        id: agent_cli
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: |
          test_python="/tmp/qm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/i/qorqbot/runtime/venv/bin/python"
          mkdir -p "$MAC_EVIDENCE"
          "$test_python" -I -B qorqut-code/tools/distribution/macos_app/agent_cli_check.py --output "$MAC_EVIDENCE/agent-cli" --root "$AGENT_CLI_ROOT"
      - name: Managed agent host with the real Claude Code, no account
        id: managed_host
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          test_python="/tmp/qm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/i/qorqbot/runtime/venv/bin/python"
          mkdir -p "$MAC_EVIDENCE"
          "$test_python" -I -B qorqut-code/tools/distribution/macos_app/managed_host_check.py --output "$MAC_EVIDENCE/managed-host" --root "$AGENT_CLI_ROOT"
      - name: Check desktop launcher and signed DMG
        run: |
          npm test --prefix qorqut-code/tools/distribution/macos_app/electron
          python -B -m unittest discover -s qorqut-code/tools/distribution/macos_app/tests
      - name: Build the downloadable DMG from the checked archive
        if: inputs.version != ''
        run: |
          python qorqut-code/tools/distribution/macos_app/build_dmg.py --archive "$RELEASE_WORK/package/qorqbot-${QORQBOT_BUILD_VERSION}-macos14-arm64.tar.gz" --output "$RELEASE_WORK/dmg"
      - name: Check the packaged launcher with a fresh home folder
        if: inputs.version != ''
        run: |
          mount="$RELEASE_WORK/mounted"
          mkdir "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$RELEASE_WORK/dmg/Qorqbot-${QORQBOT_BUILD_VERSION}-macos14-arm64.dmg"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/Qorqbot.app"
          codesign --verify --deep --strict "$app"
          archive="$RELEASE_WORK/package/qorqbot-${QORQBOT_BUILD_VERSION}-macos14-arm64.tar.gz"
          cmp "$archive" "$app/Contents/Resources/qorqbot-payload/$(basename "$archive")"
          digest=$(shasum -a 256 "$archive" | cut -d ' ' -f 1)
          export HOME="/tmp/qd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$HOME"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Qorqbot" qorqut-code/tools/distribution/macos_app/check_dmg.cjs "$app/Contents/Resources" "$QORQBOT_BUILD_VERSION" "$digest" "$RELEASE_WORK/desktop-check.json"
      - name: Save the checked candidate and build evidence
        if: inputs.version != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qorqbot-mac-${{ env.QORQBOT_BUILD_VERSION }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ env.RELEASE_WORK }}/dmg/*
            ${{ env.RELEASE_WORK }}/package/*.tar.gz
            ${{ env.RELEASE_WORK }}/build.json
            ${{ env.RELEASE_WORK }}/desktop-check.json
      - name: Save Mac qualification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/qorqbot-mac/*.json
            ${{ runner.temp }}/qorqbot-mac/prepared/logs/*.log
            /tmp/qm-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            /tmp/qm-${{ github.run_id }}-${{ github.run_attempt }}/*.log
      - name: Save the managed-agent evidence (tests, download, host)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-agent-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/mac-evidence
      - name: Show the managed-agent evidence and fail the job when a step of it failed
        if: always()
        run: |
          for file in "$MAC_EVIDENCE/new-tests/summary.md"; do [ -f "$file" ] && cat "$file" >>"$GITHUB_STEP_SUMMARY"; done
          echo "full suite: ${{ steps.suite.outcome }}, new-module tests: ${{ steps.new_tests.outcome }}, real download: ${{ steps.agent_cli.outcome }}, managed host: ${{ steps.managed_host.outcome }}"
          test "${{ steps.suite.outcome }}" != failure -a "${{ steps.new_tests.outcome }}" != failure -a "${{ steps.agent_cli.outcome }}" != failure -a "${{ steps.managed_host.outcome }}" != failure
      # This job prepares and checks a candidate only. It does not publish,
      # change repository visibility or use accounts/native agent clients.
      # Real terminal/browser acceptance remains a separate Mac release gate.
  first-open:
    # Release gate: the disk image built above, opened on a new Mac with no Homebrew, Python, tmux or Apple
    # developer tools, must set itself up and show the sign-in screen.
    name: Clean Mac opens the download (${{ matrix.os }})
    needs: macos
    # Also when the job above failed on a test: the disk image is built and uploaded before that is reported.
    if: ${{ !cancelled() && inputs.version != '' && needs.macos.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.macos.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the disk image this run built
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "qorqbot-mac-$VERSION" --dir "$RUNNER_TEMP/candidate"
      - name: Open it as a new person would
        run: |
          dmg="$(find "$RUNNER_TEMP/candidate" -name "Qorqbot-${VERSION}-macos14-arm64.dmg" | head -n 1)"
          test -n "$dmg"
          bash qorqut-code/tools/distribution/macos_app/first_open_check.sh "$dmg" "$RUNNER_TEMP/first-open"
      - name: Save the screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-first-open-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/first-open
