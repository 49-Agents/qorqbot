name: Checks
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      dashboard: ${{ steps.select.outputs.dashboard }}
      distribution: ${{ steps.select.outputs.distribution }}
      connectors: ${{ steps.select.outputs.connectors }}
      connector_selection: ${{ steps.select.outputs.connector_selection }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select checks from the complete change
        id: select
        run: python3 qorqut-code/tools/ci/changes.py
      - name: Check CI selection rules
        run: python3 -B -m unittest discover -s qorqut-code/tools/ci/tests
      - name: Keep system-specific calls in the system layer
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 qorqut-code/tools/ci/system_calls.py --base-ref "$BASE_REF"
          else
            python3 qorqut-code/tools/ci/system_calls.py
          fi
      - name: Scan complete Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" --output "$scanner_dir/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$scanner_dir/$archive" | sha256sum --check --strict
          tar -xzf "$scanner_dir/$archive" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git "$GITHUB_WORKSPACE" --log-opts=--all --redact --no-banner
  base-branch:
    # main takes pull requests only from dev; every other pull request targets dev.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Pull requests into main come from dev
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$BASE" = main ] && { [ "$HEAD" != dev ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; }; then
            echo "::error::main takes pull requests only from dev. Open this pull request against dev."
            exit 1
          fi
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The start text comparison below checks out the base commit, which a one-commit fetch does not hold.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/*constraints.txt
      - name: Install current source and test dependencies
        run: |
          # psutil's macOS adapters also have portable mocked tests on Linux.
          python -m pip install 'setuptools>=77.0.3' wheel 'psutil>=7,<8'
          python -m pip install --no-build-isolation -c qorqut-code/app/service-constraints.txt \
            ./qorqut-agentic ./dependencies/document-history \
            ./qorqut-code/qorqut-operations ./qorqut-code/qorqut-context ./qorqut-system \
            './qorqut-code/app[service]'
      - name: Run application and release-tool unit tests
        run: |
          python -I -B -m unittest discover -s qorqut-system/tests
          python -I -B -m unittest discover -s qorqut-code/app/tests --durations 30
          python -I -B -m unittest discover -s qorqut-code/tools/tests
          python -I -B -m unittest discover -s qorqut-code/tools/distribution/tests
      - name: Compare every default agent's start text with the base commit
        # The proof that a change moves code without changing what an agent is told.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          base="$RUNNER_TEMP/start-texts-base"
          work="$RUNNER_TEMP/start-texts"
          git worktree add --detach "$base" "$BASE_SHA"
          mkdir -p "$work"
          # The base record resolves with the base commit's own code and export tool; the head record uses this checkout.
          PYTHONPATH="$base/qorqut-system/src:$base/qorqut-agentic/src:$base/qorqut-code/qorqut-operations:$base/qorqut-code/qorqut-context:$base/qorqut-code/app:$base/dependencies/document-history/src" \
            python qorqut-code/tools/start_texts.py record --repository "$GITHUB_WORKSPACE" --commit "$BASE_SHA" \
              --exporter "$base/qorqut-code/tools/export-unified.py" --output "$work/base.json" --work "$work"
          python qorqut-code/tools/start_texts.py record --repository "$GITHUB_WORKSPACE" --commit "$head" \
            --output "$work/head.json" --work "$work"
          python qorqut-code/tools/start_texts.py compare "$work/base.json" "$work/head.json"

  backend-mac:
    # Required: the Mac job is listed in checks-passed, so a red one blocks a merge.
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/*constraints.txt
      - name: Install current source and test dependencies
        run: |
          python -m pip install 'setuptools>=77.0.3' wheel 'psutil>=7,<8'
          python -m pip install --no-build-isolation -c qorqut-code/app/service-constraints.txt \
            ./qorqut-agentic ./dependencies/document-history \
            ./qorqut-code/qorqut-operations ./qorqut-code/qorqut-context ./qorqut-system \
            './qorqut-code/app[service]'
      - name: Run application, release-tool and layer unit tests
        env:
          # The managed host tests start real host processes that import the tests' own fake driver: the host takes
          # its import path from this variable (-I below makes the test process itself ignore it).
          PYTHONPATH: ${{ github.workspace }}/qorqut-code/app/tests
        run: |
          python -I -B -m unittest discover -s qorqut-system/tests
          python -I -B -m unittest discover -s qorqut-code/app/tests
          python -I -B -m unittest discover -s qorqut-code/tools/tests
          python -I -B -m unittest discover -s qorqut-code/tools/distribution/tests

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Run dashboard Node tests
        run: node --test --test-concurrency=2 qorqut-code/dashboard/tests/*.test.js

  distribution:
    needs: changes
    if: needs.changes.outputs.distribution == 'true'
    uses: ./.github/workflows/release-checks.yml
    with:
      connectors: ${{ needs.changes.outputs.connector_selection }}

  checks-passed:
    # The one check the branch rules require. A job that calls another workflow is
    # reported under a different name when it runs, so its own name cannot be required.
    needs: [changes, backend, backend-mac, dashboard, distribution]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: No selected check failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes, backend, backend-mac, dashboard, distribution: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
