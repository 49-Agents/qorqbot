name: Native Linux app checks
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional SemVer for a downloadable AppImage and .deb candidate (for example 1.3.0-preview.2)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: linux-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            **/pyproject.toml
            **/*constraints.txt
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/qorqbot/wheels
          key: ${{ runner.os }}-${{ runner.arch }}-qorqbot-wheels-v1-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-qorqbot-wheels-v1-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install desktop build dependencies and select version
        id: select
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm ci --prefix qorqut-code/tools/distribution/linux_app/electron
          node <<'JS'
          const fs = require('node:fs');
          const semver = require('./qorqut-code/tools/distribution/linux_app/electron/node_modules/semver');
          const version = process.env.RELEASE_VERSION || require('node:child_process').execFileSync('python3', ['qorqut-code/tools/distribution/build_version.py', '1.3.0', 'linux-check', '--commit', process.env.GITHUB_SHA], {encoding: 'utf8'}).trim();
          if (semver.valid(version) !== version) throw new Error('Version must be canonical SemVer');
          fs.appendFileSync(process.env.GITHUB_ENV, `QORQBOT_BUILD_VERSION=${version}\nRELEASE_WORK=${process.env.RUNNER_TEMP}/qorqbot-linux\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - name: Check native target and install build prerequisites
        run: |
          test "$(uname -m)" = x86_64
          sudo apt-get update -qq
          # librsvg2-bin draws the app icon. This job only unpacks the AppImage (no FUSE or display needed); the
          # first-open and .deb jobs below install the display and container tools they use.
          sudo apt-get install -y -qq --no-install-recommends tmux librsvg2-bin
          python -m pip install packaging
      - name: Run the desktop engine tests and the builder tests
        run: |
          npm test --prefix qorqut-code/tools/distribution/linux_app/electron
          python -B -m unittest discover -s qorqut-code/tools/distribution/linux_app/tests
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/qorqbot/linux-tools
          key: ${{ runner.os }}-${{ runner.arch }}-qorqbot-linux-tools-v1-${{ hashFiles('qorqut-code/tools/distribution/linux_tools.py', 'qorqut-code/tools/distribution/macos_tools.py') }}
      - name: Build the programs the package ships (Python, tmux, git)
        run: |
          tools="$HOME/.cache/qorqbot/linux-tools"
          if [ ! -f "$tools/out/TOOLS.json" ]; then
            rm -rf "$tools"
            mkdir -p "$tools"
            # In a clean container, so no program of this runner can end up linked into what the package ships.
            python qorqut-code/tools/distribution/linux_tools.py --docker --apt-mirror http://azure.archive.ubuntu.com/ubuntu --output "$tools/out" --work "$RUNNER_TEMP/linux-tools-work"
          fi
          cat "$tools/out/TOOLS.json"
      - name: Export and build this exact commit
        run: |
          mkdir -p "$RELEASE_WORK"
          python qorqut-code/tools/export-unified.py --repository "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" --with-fastmail --output "$RELEASE_WORK/source"
          python qorqut-code/tools/distribution/runtime_source.py project --source "$RELEASE_WORK/source" --output "$RELEASE_WORK/runtime-source" --report "$RELEASE_WORK/projection.json"
          python qorqut-code/tools/prepare-local.py --source-root "$RELEASE_WORK/runtime-source" --output "$RELEASE_WORK/prepared" --with-google-calendar --with-treg --with-openrouter
          python qorqut-code/tools/distribution/native_build.py --prepared "$RELEASE_WORK/prepared" --target ubuntu24-x86_64 --bundled-tools "$HOME/.cache/qorqbot/linux-tools/out" --output "$RELEASE_WORK/package" --report "$RELEASE_WORK/build.json" --version "$QORQBOT_BUILD_VERSION"
      - name: Check exact Linux archive lifecycle
        run: |
          python qorqut-code/tools/distribution/check_posix.py --archive "$RELEASE_WORK/package/qorqbot-${QORQBOT_BUILD_VERSION}-ubuntu24-x86_64.tar.gz" --output "/tmp/ql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Run Linux runtime and launcher tests
        run: |
          test_python="/tmp/ql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/i/qorqbot/runtime/venv/bin/python"
          "$test_python" -I -B -m unittest discover -s qorqut-code/app/tests
          "$test_python" -I -B -m unittest discover -s qorqut-code/tools/distribution/tests
      - name: Build the downloadable AppImage and .deb from the checked archive
        if: inputs.version != ''
        run: |
          python qorqut-code/tools/distribution/linux_app/build_linux_app.py --archive "$RELEASE_WORK/package/qorqbot-${QORQBOT_BUILD_VERSION}-ubuntu24-x86_64.tar.gz" --output "$RELEASE_WORK/linux-app"
          cat "$RELEASE_WORK/linux-app/SHA256SUMS"
      - name: Check the packaged launcher with a fresh home folder
        if: inputs.version != ''
        run: |
          appimage="$RELEASE_WORK/linux-app/Qorqbot-${QORQBOT_BUILD_VERSION}-x86_64.AppImage"
          archive="$RELEASE_WORK/package/qorqbot-${QORQBOT_BUILD_VERSION}-ubuntu24-x86_64.tar.gz"
          # Unpacked, the AppImage's own Electron runs the check in Node mode, as the first-open check does.
          mkdir "$RELEASE_WORK/unpacked"
          (cd "$RELEASE_WORK/unpacked" && "$appimage" --appimage-extract >/dev/null)
          app="$RELEASE_WORK/unpacked/squashfs-root"
          cmp "$archive" "$app/resources/qorqbot-payload/$(basename "$archive")"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          export HOME="/tmp/qd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$HOME"
          ELECTRON_RUN_AS_NODE=1 "$app/qorqbot-desktop" qorqut-code/tools/distribution/linux_app/check_linux_app.cjs "$app/resources" "$QORQBOT_BUILD_VERSION" "$digest" "$RELEASE_WORK/desktop-check.json"
      - name: Save the checked candidate and build evidence
        if: inputs.version != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qorqbot-linux-${{ env.QORQBOT_BUILD_VERSION }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ env.RELEASE_WORK }}/linux-app/*
            ${{ env.RELEASE_WORK }}/package/*.tar.gz
            ${{ env.RELEASE_WORK }}/build.json
            ${{ env.RELEASE_WORK }}/desktop-check.json
      - name: Save Linux qualification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-app-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/qorqbot-linux/*.json
            ${{ runner.temp }}/qorqbot-linux/prepared/logs/*.log
            /tmp/ql-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            /tmp/ql-${{ github.run_id }}-${{ github.run_attempt }}/*.log
      # This job prepares and checks a candidate only. It does not publish,
      # change repository visibility or use accounts/native agent clients.
      # Real terminal/browser acceptance on a desktop remains a separate release gate.
  first-open:
    # Release gate: the AppImage built above, opened under a new home folder with Python, git, tmux and Node.js hidden
    # from it, must set itself up, show the sign-in screen, quit and stop its server.
    name: AppImage opens the download
    needs: linux-app
    if: inputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.linux-app.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the AppImage this run built
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "qorqbot-linux-$VERSION" --dir "$RUNNER_TEMP/candidate"
      - name: Open it under a new home folder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb x11-utils fuse3
          appimage="$(find "$RUNNER_TEMP/candidate" -name "Qorqbot-${VERSION}-x86_64.AppImage" | head -n 1)"
          test -n "$appimage"
          chmod +x "$appimage"
          bash qorqut-code/tools/distribution/linux_app/first_open_check.sh "$appimage" "$RUNNER_TEMP/first-open"
      - name: Save the screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-appimage-first-open
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/first-open
  deb:
    # Release gate: `apt install ./qorqbot_VERSION_amd64.deb` on a new Ubuntu 24.04 (a container with no Python, git or
    # tmux) installs the files, the menu entry and the AppArmor profile, opens to the sign-in screen and removes cleanly.
    name: .deb installs on Ubuntu 24.04
    needs: linux-app
    if: inputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.linux-app.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the .deb this run built
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "qorqbot-linux-$VERSION" --dir "$RUNNER_TEMP/candidate"
      - name: Install, open and remove it in a container
        run: |
          deb="$(find "$RUNNER_TEMP/candidate" -name "qorqbot_${VERSION}_amd64.deb" | head -n 1)"
          test -n "$deb"
          bash qorqut-code/tools/distribution/linux_app/check_deb.sh "$deb" "$RUNNER_TEMP/deb-check"
      - name: Save the logs and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-deb-check
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/deb-check
