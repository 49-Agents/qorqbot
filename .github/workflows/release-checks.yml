# Install at .github/workflows/release-checks.yml in the single publication repo.
name: Release checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan complete Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" --output "$scanner_dir/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$scanner_dir/$archive" | sha256sum --check --strict
          tar -xzf "$scanner_dir/$archive" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git "$GITHUB_WORKSPACE" --log-opts=--all --redact --no-banner
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install packaging
      - name: Export, build and check the exact commit
        env:
          RELEASE_WORK: ${{ runner.temp }}/qorqbot-release
        run: |
          mkdir -p "$RELEASE_WORK"
          python qorqut-code/tools/export-unified.py --repository "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" --with-fastmail --output "$RELEASE_WORK/source"
          python qorqut-code/tools/distribution/runtime_source.py project --source "$RELEASE_WORK/source" --output "$RELEASE_WORK/runtime-source" --report "$RELEASE_WORK/projection.json"
          python qorqut-code/tools/prepare-local.py --source-root "$RELEASE_WORK/runtime-source" --output "$RELEASE_WORK/prepared" --with-google-calendar
          python qorqut-code/tools/distribution/runtime_source.py audit --prepared "$RELEASE_WORK/prepared" --report "$RELEASE_WORK/contents.json"
          python qorqut-code/tools/distribution/native_build.py --prepared "$RELEASE_WORK/prepared" --output "$RELEASE_WORK/package" --report "$RELEASE_WORK/build.json" --version "1.3.0-check.${GITHUB_SHA:0:12}"
          python qorqut-code/tools/distribution/check_native.py --archive "$RELEASE_WORK/package/qorqbot-1.3.0-check.${GITHUB_SHA:0:12}-ubuntu24-x86_64.tar.gz" --output "$RELEASE_WORK/acceptance"
      - name: Build and qualify optional connectors
        env:
          RELEASE_WORK: ${{ runner.temp }}/qorqbot-release
        run: |
          set -euo pipefail
          optional="$RELEASE_WORK/optional"
          mkdir -p "$optional/wheels" "$optional/dependencies" "$optional/bundles"
          python -m pip wheel --no-deps --wheel-dir "$optional/wheels" "$RELEASE_WORK/source/qorqut-code/extensions/telegram" "$RELEASE_WORK/source/extensions/qorqut-fastmail"
          python -m pip download --no-deps --only-binary=:all: --dest "$optional/dependencies" Pillow==12.3.0 icalendar==7.3.0 python-dateutil==4.0.0 tzdata==2026.6
          telegram_wheels=("$optional/wheels"/qorqut_telegram-*.whl "$optional/dependencies"/pillow-*.whl)
          wheel_args=()
          for wheel in "${telegram_wheels[@]}"; do wheel_args+=(--wheel "$wheel"); done
          python qorqut-code/tools/distribution/extension_bundle.py --id telegram "${wheel_args[@]}" --output "$optional/bundles/telegram.tar.gz" > "$optional/telegram.json"
          fastmail_wheels=("$optional/wheels"/qorqut_fastmail-*.whl "$optional/dependencies"/icalendar-*.whl "$optional/dependencies"/python_dateutil-*.whl "$optional/dependencies"/tzdata-*.whl)
          wheel_args=()
          for wheel in "${fastmail_wheels[@]}"; do wheel_args+=(--wheel "$wheel"); done
          python qorqut-code/tools/distribution/extension_bundle.py --id fastmail "${wheel_args[@]}" --output "$optional/bundles/fastmail.tar.gz" > "$optional/fastmail.json"
          python "$RELEASE_WORK/source/qorqut-code/extensions/whatsapp/tools/build.py" --work "$optional/whatsapp"
          source_trees=("$optional/whatsapp"/qorqut-whatsapp-*-source)
          source_image=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["build"]["go_image"])' "${source_trees[0]}/SOURCE-MANIFEST.json")
          mkdir -p "$optional/whatsapp/source-rebuild"
          docker run --rm --network none --user "$(id -u):$(id -g)" --mount "type=bind,src=${source_trees[0]},dst=/source,readonly" --mount "type=bind,src=$optional/whatsapp/source-rebuild,dst=/build" -w /source "$source_image" ./build.sh /build
          cmp "$optional/whatsapp/native/whatsapp-personal" "$optional/whatsapp/source-rebuild/whatsapp-personal"
          whatsapp_wheels=("$optional/whatsapp/dist"/qorqut_whatsapp-*.whl)
          wheel_args=()
          for wheel in "${whatsapp_wheels[@]}"; do wheel_args+=(--wheel "$wheel"); done
          python qorqut-code/tools/distribution/extension_bundle.py --id whatsapp "${wheel_args[@]}" --output "$optional/bundles/whatsapp.tar.gz" > "$optional/whatsapp.json"
          python qorqut-code/tools/distribution/check_optional_extensions.py --archive "$RELEASE_WORK/package/qorqbot-1.3.0-check.${GITHUB_SHA:0:12}-ubuntu24-x86_64.tar.gz" --bundle "whatsapp=$optional/bundles/whatsapp.tar.gz" --bundle "telegram=$optional/bundles/telegram.tar.gz" --bundle "fastmail=$optional/bundles/fastmail.tar.gz" --report-directory "$RELEASE_WORK/optional-acceptance"
      # These jobs validate locally built candidates. They never publish a GitHub
      # Release, modify repository settings, or deploy an installation.
